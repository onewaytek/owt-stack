name: Conventional Commits

# release-please reads the history on main to choose each version, so what lands
# there must follow Conventional Commits (https://www.conventionalcommits.org):
# the pull request title, which a squash merge uses as the commit, and every commit,
# which a merge commit keeps. commitlint reads the pull request's commitlint
# configuration, which is JavaScript and runs: so this job holds no secrets and only
# a read token.
#
# A pull request from a branch of the repository itself runs on the arc-openshift-k8s
# ARC scale set, as rust-ci.yml's checks do (override with the RUNS_ON repository or
# organization variable, a JSON string such as '"ubuntu-latest"'). A fork's pull
# request is checked too, but on GitHub-hosted runners: its code never runs on the
# scale set. Node comes from setup-node; nothing else is assumed installed.
#
# Reusable too: an app whose release.yml derives its version from its commits calls
# it from its pull-request workflow, so the same rules, commitlint and versions check
# every app:
#
#   jobs:
#     commits:
#       permissions: {contents: read, pull-requests: read}
#       uses: onewaytek/owt-stack/.github/workflows/conventional-commits.yml@<commit>  # vX.Y.Z
#
# The caller's event must be a pull request (the title and the commits are its),
# never `pull_request_target`, whose checkout would run a fork's code with a token
# that can write. An app with a commitlint configuration of its own
# (commitlint.config.*, .commitlintrc*, a "commitlint" key in package.json) is
# checked by it; one without is checked by the rules below, written for the run.
# A title edited after the push is re-checked only when the caller's
# `pull_request` types include `edited`; the requeue flow prefers the defaults, so
# an app on it accepts that a title fixed by hand is checked at the next push.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions: {}

jobs:
  title:
    # A fork's pull request (or no pull request at all), and any repository outside
    # the organization that owns the scale set, runs GitHub-hosted.
    runs-on: ${{ fromJSON(github.repository_owner == 'onewaytek' && github.event.pull_request.head.repo.full_name == github.repository && (vars.RUNS_ON || '"arc-openshift-k8s"') || '"ubuntu-latest"') }}
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # A one-commit pull request squashes to that commit's message by default.
          validateSingleCommit: true

  commits:
    # A fork's pull request (or no pull request at all), and any repository outside
    # the organization that owns the scale set, runs GitHub-hosted.
    runs-on: ${{ fromJSON(github.repository_owner == 'onewaytek' && github.event.pull_request.head.repo.full_name == github.repository && (vars.RUNS_ON || '"arc-openshift-k8s"') || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The configuration: the repository's own where it has one, else the rules
      # this repository checks itself by (commitlint.config.mjs here, byte for
      # byte; `just ci-config` compares the two), written outside the checkout.
      # Dependabot's commits are passed over either way: their bodies quote release
      # notes whose lines run past the length limit, and their headers are generated.
      - name: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "::error::not a pull request: the caller's event carries no base and head"
            exit 1
          fi
          config=()
          shopt -s nullglob
          own=(commitlint.config.* .commitlintrc*)
          shopt -u nullglob
          # Or a "commitlint" key in package.json, which commitlint reads too.
          if [ "${#own[@]}" -eq 0 ] && ! grep -q '"commitlint"' package.json 2>/dev/null; then
            cat > "$RUNNER_TEMP/commitlint.config.mjs" <<'JS'
          // Commit messages and pull request titles follow Conventional Commits, which
          // release-please reads to choose the next version and write the changelog.
          //
          // A subject starts lower-case ("fix(web): drop the …"), unless its first word is a
          // code identifier: a word with a capital, a digit, an underscore or `::` after its
          // first letter (`PUBLIC_URL`, `URL`, `ClientIp`, `S3`, `Sessions::from_env`), or a
          // word in backticks. So
          // "fix(deploy): PUBLIC_URL comes only from the params file" passes and
          // "fix(web): Drop the …" does not. conventional-commits.yml writes the same rules
          // for an app without a configuration of its own; the two copies stay identical.
          const identifier = /^(`[^`]+`|[A-Za-z][\w:]*([A-Z0-9_]|::)[\w:]*)$/;
          export default {
            extends: ["@commitlint/config-conventional"],
            plugins: [
              {
                rules: {
                  "subject-first-word": ({ subject }) => {
                    const word = (subject ?? "").split(/\s/)[0].replace(/[,;:.]$/, "");
                    const ok = !/^[A-Z]/.test(word) || identifier.test(word);
                    return [ok, "subject must start lower-case, unless its first word is a code identifier"];
                  },
                },
              },
            ],
            rules: {
              // The default forbids sentence, start, pascal and upper case, which a subject
              // that starts with (or is) an identifier looks like. `subject-first-word`
              // decides instead: a capital opens a subject only as part of an identifier.
              "subject-case": [0],
              "subject-first-word": [2, "always"],
            },
            // Dependabot's bodies quote release notes, whose lines run past the length limit.
            // Its headers ("fix(deps): bump ...") are generated, and the title check sees them.
            ignores: [(message) => message.includes("Signed-off-by: dependabot[bot]")],
          };
          JS
            config=(--config "$RUNNER_TEMP/commitlint.config.mjs")
          fi
          npx --yes --ignore-scripts -p @commitlint/cli@21.2.3 -p @commitlint/config-conventional@21.2.3 \
            commitlint "${config[@]}" --from "$BASE" --to "$HEAD" --verbose
