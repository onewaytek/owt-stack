name: Conventional Commits

# release-please reads the history on main to choose each version, so what lands
# there must follow Conventional Commits (https://www.conventionalcommits.org):
# the pull request title, which a squash merge uses as the commit, and every commit,
# which a merge commit keeps. Nothing here runs the pull request's code, so it runs
# for forks too, on GitHub-hosted runners.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # A one-commit pull request squashes to that commit's message by default.
          validateSingleCommit: true

  commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          npx --yes -p @commitlint/cli@21.2.3 -p @commitlint/config-conventional@21.2.3
          commitlint --from "$BASE" --to "$HEAD" --verbose
