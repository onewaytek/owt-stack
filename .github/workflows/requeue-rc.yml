name: Requeue rc promotions

# Reusable: promote again a PR whose checked promotion (promote-rc.yml's candidate
# flow) was lost rather than refused. Two ways lose one:
#
# - GitHub keeps one pending run per concurrency group. A third run arriving while
#   one runs and one waits cancels the waiting one, so that PR is never merged into
#   rc until it is pushed again.
# - publish-rc.yml refuses a candidate when rc moved while it was checked; the run
#   fails at "Move rc to the candidate", having lost a race, not a check.
#
# This finds the open, same-repository, non-draft PRs into `base` whose head is not
# in rc and whose latest promoting run of `workflow` for that head ended either way,
# and re-runs the oldest one (the whole run, so the promotion starts from a fresh
# candidate). A run that succeeded without running promote-rc.yml's "Merge into rc"
# step (a trigger such as `edited` that skips the candidate job) is passed over, so it
# can't hide a lost promotion for the same head. One at a time, and only while no run
# of `workflow` is waiting: a re-run is a new arrival in the concurrency group and
# would cancel a waiting run, which is the first loss over again. A run that failed
# its checks is not re-run; nor is one already on its `max-attempts`th attempt. Call
# it from the candidate workflow after publishing, so each promotion hands on to the
# next lost one, and from a schedule, for when no promotion follows. The scheduled
# one runs outside the concurrency group, so both can pick the same run; the run is
# read again before it is re-run and once more if GitHub refuses the re-run, and a run
# that is going again is logged, not failed, whatever GitHub's refusal says. Any
# other refusal of one run is a warning and the next PR is tried, so a run GitHub
# won't re-run (one over a month old) can't starve the rest; a refusal for want of
# `actions: write` fails the job once every PR is walked:
#
#   # pr.yml, beside the candidate flow
#   requeue:
#     needs: promote
#     if: always() && github.event.pull_request.head.repo.full_name == github.repository
#     permissions: {actions: write, contents: read, pull-requests: read}
#     uses: onewaytek/owt-stack/.github/workflows/requeue-rc.yml@vX.Y.Z  # the release the app uses
#     with: {workflow: pr.yml}
#
#   # requeue-rc.yml
#   on:
#     schedule: [{cron: "*/30 * * * *"}]
#     workflow_dispatch:
#   jobs:
#     requeue:
#       permissions: {actions: write, contents: read, pull-requests: read}
#       uses: onewaytek/owt-stack/.github/workflows/requeue-rc.yml@vX.Y.Z
#       with: {workflow: pr.yml}
#
# Runs on the arc-openshift-k8s ARC scale set, as rust-ci.yml does (override with the
# RUNS_ON repository or organization variable, a JSON string such as
# '"ubuntu-latest"'); it needs only git and the runner's own Node, which runs the
# github-script steps. Its token can write, so it runs only for the repository's own
# events: a push, a dispatch, a schedule, or a pull request from a branch of the
# repository itself. A fork's pull request, `pull_request_target` and `workflow_run`
# start nothing here, so neither the scale set nor the token is reachable from a fork.

on:
  workflow_call:
    inputs:
      workflow:
        description: The app's workflow file that runs the candidate flow on its PRs.
        type: string
        default: pr.yml
      base:
        description: The branch the PRs merge into.
        type: string
        default: main
      max-attempts:
        description: Re-run a PR's run only while its attempt number is below this.
        type: number
        default: 5

permissions:
  contents: read

jobs:
  requeue:
    if: >-
      ${{ github.repository_owner == 'onewaytek'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run a lost promotion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW: ${{ inputs.workflow }}
          BASE: ${{ inputs.base }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = process.env.WORKFLOW;
            const maxAttempts = Number(process.env.MAX_ATTEMPTS);
            // The step publish-rc.yml fails at when rc moved under the candidate.
            const raceStep = "Move rc to the candidate";
            // promote-rc.yml's step that makes the candidate: a run that ran it set
            // out to promote (keep that name too).
            const mergeStep = "Merge into rc";
            // A refusal of a re-run for want of permission, reported once the PRs are walked.
            let denied = "";

            for (const status of ["requested", "queued", "pending", "waiting"]) {
              const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, status, per_page: 1 });
              if (data.total_count > 0) {
                core.info(`a run of ${workflow_id} is ${status}; a re-run now could cancel it, so none is made`);
                return;
              }
            }

            let rc;
            try {
              rc = (await github.rest.git.getRef({ owner, repo, ref: "heads/rc" })).data.object.sha;
            } catch (e) {
              if (e.status === 404) { core.info("no rc branch"); return; }
              throw e;
            }

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", base: process.env.BASE, sort: "updated", direction: "asc", per_page: 100,
            });
            for (const pr of prs) {
              if (pr.draft || pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              const head = pr.head.sha;
              // rc is ahead of (or at) the head: the head is already in rc.
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${head}...${rc}`, per_page: 1,
              });
              if (cmp.status === "ahead" || cmp.status === "identical") continue;

              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, head_sha: head, event: "pull_request", per_page: 20,
              });
              // The newest run that set out to promote this head decides. One that
              // succeeded without merging (an `edited` or `labeled` trigger whose
              // candidate job was skipped) is passed over, so it cannot hide a lost
              // promotion beneath it.
              let run;
              let lost = false;
              for (const r of runs.workflow_runs) {
                // Still going: it may yet promote, so leave the PR to it.
                if (r.status !== "completed") break;
                // Cancelled, waiting or running: a candidate it would have made was never
                // published. A run cancelled before its candidate job ran can't be told
                // from one that would have skipped it (a job behind a cancelled one is
                // reported skipped too), so every cancelled run counts as lost; a
                // non-promoting one re-runs, merges nothing and succeeds, and the next
                // pass looks beneath it.
                if (r.conclusion === "cancelled") { run = r; lost = true; break; }
                if (!["success", "neutral", "skipped", "failure"].includes(r.conclusion)) {
                  // timed_out, startup_failure, action_required: not a lost race, and a
                  // re-run would not settle them. Left for a person, like a failed check.
                  core.info(`#${pr.number}: run ${r.id} ended ${r.conclusion}; leaving it`);
                  break;
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  owner, repo, run_id: r.id, attempt_number: r.run_attempt, per_page: 100,
                });
                const steps = jobs.flatMap((j) => j.steps ?? []);
                if (r.conclusion === "failure") {
                  // Lost the race at publishing, or failed a check (which is not re-run).
                  run = r;
                  lost = steps.some((s) => s.name === raceStep && s.conclusion === "failure");
                  break;
                }
                // Succeeded: a promotion if it merged; otherwise look further back.
                if (steps.some((s) => s.name === mergeStep && s.conclusion && s.conclusion !== "skipped")) {
                  run = r;
                  break;
                }
              }
              if (!run || !lost) continue;
              if (run.run_attempt >= maxAttempts) {
                core.info(`#${pr.number}: run ${run.id} is on attempt ${run.run_attempt}; leaving it`);
                continue;
              }

              // The scheduled requeue runs outside the promote-rc group, so it can pick
              // the run the in-group one has just re-run. The run itself says so,
              // whatever wording GitHub refuses a second re-run with: one that is not
              // completed is going again, which is what was wanted, and one whose
              // attempt has moved since the list was read was re-run and has finished
              // again, so re-running it now would be a second re-run for one loss. It
              // is read before the re-run and, since the other requeue can get in
              // between, again on a refusal. The answer is empty when the run is as
              // listed, else what changed.
              const goingAgain = async () => {
                const { data } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
                if (data.status !== "completed") return `is ${data.status} again`;
                if (data.run_attempt !== run.run_attempt) {
                  return `moved from attempt ${run.run_attempt} to ${data.run_attempt}`;
                }
                return "";
              };
              let moved;
              try {
                moved = await goingAgain();
              } catch (e) {
                // Deleted since the list was read: nothing to re-run.
                if (e.status !== 404) throw e;
                core.info(`#${pr.number}: run ${run.id} is gone; leaving it`);
                continue;
              }
              if (moved) {
                core.info(`#${pr.number}: run ${run.id} ${moved}; another requeue got there first`);
                return;
              }

              core.notice(`#${pr.number}: run ${run.id} (${run.conclusion}) never promoted ${head}; re-running it`);
              try {
                await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
              } catch (e) {
                if (![403, 409, 422].includes(e.status)) throw e;
                // GitHub's own message: the error's `message` also carries the endpoint's
                // documentation link, which names re-runs whatever the refusal was.
                const why = e.response?.data?.message ?? "";
                // The status decides; GitHub's "already running" is a second net, for
                // when the run cannot be read again.
                let now = "";
                try {
                  now = await goingAgain();
                } catch (read) {
                  core.warning(`#${pr.number}: run ${run.id} could not be read again (${read.message})`);
                }
                if (now || /already running/i.test(why)) {
                  core.info(`#${pr.number}: run ${run.id} ${now || "is already running"}; another requeue got there first`);
                  return;
                }
                // Any other refusal is about this run (one created over a month ago, say)
                // or about this job's token. Either way try the next PR, so one refused
                // run cannot starve the rest; a token without `actions: write` fails the
                // job once the PRs are walked.
                if (e.status === 403 && /not accessible|permission|must have/i.test(why)) denied = why;
                core.warning(`#${pr.number}: run ${run.id} was not re-run (${e.status}: ${why || e.message})`);
                continue;
              }
              return;
            }
            if (denied) {
              core.setFailed(`re-runs were refused for want of permission (${denied}): the calling job needs \`actions: write\``);
              return;
            }
            core.info("no lost promotion");
