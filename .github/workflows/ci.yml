name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/rust-ci.yml
    with:
      # The crates hold no SQL of their own to check; owt-bus tests against Redis.
      redis: true
      sqlx-check: false
      css-script: ""
      test-args: --workspace --all-features
