name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/rust-ci.yml
    with:
      # The same gate a developer runs (justfile). The crates hold no migrations;
      # owt-runtime's job tests take advisory locks on a Postgres, and owt-bus's
      # and the leases' tests use Redis.
      check-command: just check
      database: owt
      redis: true
      css-script: ""
