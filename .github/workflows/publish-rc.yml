name: Publish rc

# Reusable: the second half of a checked promotion (promote-rc.yml has the whole
# caller). promote-rc.yml with `candidate: true` pushed a merge to `rc-candidate`;
# once the app's checks pass on that commit, this moves rc to it and starts its
# prerelease. rc only fast-forwards: if it moved while the candidate was checked,
# the candidate was checked against something rc no longer is, and this fails
# rather than publish it. Merging the PR onto the new rc here would publish a merge
# nobody checked, so the retry is a fresh promotion: requeue-rc.yml re-runs the PR's
# workflow when it finds a run that failed at the "Move rc to the candidate" step
# (keep that name: it tells a lost race from a failed check).
#
# Runs on the arc-openshift-k8s ARC scale set, as rust-ci.yml does (override with the
# RUNS_ON repository or organization variable, a JSON string such as
# '"ubuntu-latest"'); it needs only git and the runner's own Node, which runs the
# github-script steps. Its token can write, so it runs only for the repository's own
# events: a push, a dispatch, a schedule, or a pull request from a branch of the
# repository itself. A fork's pull request, `pull_request_target` and `workflow_run`
# start nothing here, so neither the scale set nor the token is reachable from a fork.
#
# The caller grants `contents: write`, `actions: write` and `id-token: write`. The last
# signs the record of the checked commit (`gate`, below); the job requests it whether or
# not `gate` is set, because a reusable workflow's permissions are fixed when it starts.

on:
  workflow_call:
    inputs:
      sha:
        description: The checked candidate (promote-rc.yml's `sha` output).
        type: string
        required: true
      base:
        description: The rc commit the candidate was merged onto (its `base` output).
        type: string
        default: ""
      dispatch-release:
        description: Start the app's release workflow on rc.
        type: boolean
        default: true
      release-workflow:
        description: The app's release workflow file, dispatched on rc.
        type: string
        default: release.yml
      gate:
        description: >-
          The checks' `gate` output (rust-ci.yml) from the candidate's check in this
          run. When set, rc's release skips the checks for this exact commit (see
          "The checked commit" below); empty, it runs them. The record is signed with
          the job's OIDC token, so the caller grants `id-token: write`.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{ github.repository_owner == 'onewaytek'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    permissions:
      contents: write
      actions: write
      # The OIDC token that signs the checked commit (see "The checked commit" below).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move rc to the candidate
        env:
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/rc-candidate:refs/remotes/origin/rc-candidate"
          git fetch --no-tags origin "+refs/heads/rc:refs/remotes/origin/rc" 2>/dev/null || true
          now=$(git rev-parse -q --verify refs/remotes/origin/rc || true)
          if [ "$now" != "$BASE" ]; then
            echo "::error::rc moved while the candidate was checked (from ${BASE:-nothing} to ${now}); promote again (requeue-rc.yml does)"
            exit 1
          fi
          git cat-file -e "${SHA}^{commit}"
          if [ -n "$BASE" ] && ! git merge-base --is-ancestor "$BASE" "$SHA"; then
            echo "::error::${SHA} does not descend from rc (${BASE})"
            exit 1
          fi
          # No force: a writer that moved rc since the fetch makes this fail.
          git push origin "${SHA}:refs/heads/rc"
          git push --force-with-lease="rc-candidate:${SHA}" origin :refs/heads/rc-candidate || true
      # The checked commit: refs/owt/rc-checked/<gate>/<unix time> on the candidate tells
      # rc's release (rust-ci.yml's `tested`) that this run's checks passed this exact
      # commit with that gate, so it need not run them again. Written only when the
      # workflow files that ran here are the candidate's own (so rc's release runs the
      # same checks, pinned the same), and it replaces every earlier record. A failure
      # in any of these three steps only costs the skip: the release then runs the checks.
      #
      # The ref is only where the evidence is kept, not the evidence: anyone who can push
      # can create a ref outside refs/heads and refs/tags, and no rule protects that
      # namespace. The ref is an annotated tag object on the candidate whose message is
      # a GitHub Actions OIDC token minted here, for the audience
      # `owt-rc-checked:<candidate>:<gate>`. GitHub signs it, and its `job_workflow_ref`
      # claim names this workflow, which no push, token or other workflow can mint, so
      # `tested` honours a record only when the signature, the audience, the repository,
      # that claim and the token's age all check out (see rust-ci.yml).
      - name: Compare the candidate's workflows
        id: same
        if: ${{ inputs.gate != '' }}
        continue-on-error: true
        env:
          SHA: ${{ inputs.sha }}
          GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GATE" =~ ^[0-9a-f]{16}$ ]] || { echo "::warning::gate '$GATE' is malformed: not recorded"; exit 0; }
          if ! git cat-file -e "${GITHUB_SHA}^{commit}" || ! git diff --quiet "$GITHUB_SHA" "$SHA" -- .github; then
            echo "the candidate's .github differs from the workflows that checked it: not recorded"
            exit 0
          fi
          echo "same=true" >> "$GITHUB_OUTPUT"
      - name: Sign the checked commit
        id: sign
        if: ${{ steps.same.outputs.same == 'true' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHA: ${{ inputs.sha }}
          GATE: ${{ inputs.gate }}
        with:
          script: |
            const token = await core.getIDToken(`owt-rc-checked:${process.env.SHA}:${process.env.GATE}`);
            require("fs").writeFileSync(`${process.env.RUNNER_TEMP}/rc-checked.jwt`, token, { mode: 0o600 });
            core.setOutput("signed", "true");
      - name: Record the checked commit
        if: ${{ steps.sign.outputs.signed == 'true' }}
        continue-on-error: true
        env:
          SHA: ${{ inputs.sha }}
          GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          jwt="${RUNNER_TEMP}/rc-checked.jwt"
          now=$(date +%s)
          tag=$(printf 'object %s\ntype commit\ntag rc-checked\ntagger publish-rc <publish-rc@owt.invalid> %s +0000\n\n%s\n' \
            "$SHA" "$now" "$(cat "$jwt")" | git mktag)
          rm -f "$jwt"
          name="refs/owt/rc-checked/${GATE}/${now}"
          args=("+${tag}:${name}")
          # ls-remote matches a pattern against the tail of each name; delete only
          # the records themselves, never a branch whose name ends like one, and not
          # the name this push replaces (a record made in the same second).
          while read -r _ ref; do
            if [[ "$ref" == refs/owt/rc-checked/* && "$ref" != *'^{}' && "$ref" != "$name" ]]; then
              args+=(":${ref}")
            fi
          done < <(git ls-remote origin 'refs/owt/rc-checked/*')
          git push --atomic origin "${args[@]}"
      - name: Release rc
        if: ${{ inputs.dispatch-release }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW: ${{ inputs.release-workflow }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW,
              ref: "rc",
            });
