name: Promote to rc

# Reusable: keep the `rc` branch a superset of main plus every feature in flight,
# so each PR's change ships as an X.Y.Z-rc.N prerelease before it merges.
#
#   # pr.yml, after the checks pass on a same-repository PR into main:
#   promote:
#     needs: [ci]
#     permissions: {contents: write, actions: write, pull-requests: write}
#     uses: onewaytek/owt-stack/.github/workflows/promote-rc.yml@vX.Y.Z  # the release the app uses
#     with: {source: "${{ github.event.pull_request.head.ref }}", pr: "${{ github.event.pull_request.number }}"}
#
#   # release.yml, after a stable release on main:
#   sync-rc:
#     needs: release
#     if: github.ref_name == 'main'
#     permissions: {contents: write, actions: write, pull-requests: write}
#     uses: onewaytek/owt-stack/.github/workflows/promote-rc.yml@vX.Y.Z  # the release the app uses
#     with: {source: main}
#
# The merge retries on a non-fast-forward, so concurrent promotions serialize
# without losing work. Conflicts resolve toward the incoming side (-X theirs):
# PRs are squash-merged into main while rc carries their individual commits, so the
# histories disagree on every line a later change edits again; main holds the final
# form of anything rc already has, and a feature head is the newest intent for its
# lines. A structural conflict (modify/delete, rename) still fails, and is reported
# on the PR. The cost of -X theirs: two features in flight that edit the same lines
# leave rc with whichever was promoted last until the next promotion or sync, and a
# PR closed without merging stays in rc until it is reverted there.
#
# A push made with the workflow's own token starts no workflow, so the rc release is
# started by dispatching the app's release workflow, which a workflow_dispatch may.
# That holds for the sync after a stable release too (`source: main`), with one
# condition: the release is dispatched only when the merge changed rc's tree. A merge
# of main usually changes only the history (rc already carries the squashed pull
# requests), and a release of identical code is not worth an image and a rollout; a
# fix committed straight to main changes the tree and is released on rc. The test is
# the whole tree, so it is looser than "main brought code": `-X theirs` can move rc's
# tree toward main where an in-flight feature edits the same lines, and an app whose
# release commits `chore(release)` files back to main (`version-files`, `changelog`)
# gets a changed tree from every sync. Such a dispatch is harmless: semantic-release
# finds nothing releasable (`chore`), publishes nothing and builds no image, and costs
# one run of the release workflow. The rule applies to this direct path only; with
# `candidate: true`, publish-rc.yml dispatches on every publish.
#
# A release run on rc that failed and is re-run after rc moved publishes nothing
# (semantic-release refuses to release from a commit behind its branch). The next
# dispatch releases everything since the last tag, the failed run's commits included,
# but a history-only sync dispatches none, so until the next promotion or tree-changing
# sync those commits wait.
#
# A branch's own checks don't check rc: two branches built beside each other can each
# pass and still break rc together (two migrations taking one number merge without a
# conflict). With `candidate: true` the merge goes to `rc-candidate` instead, nothing
# is released, and the outputs name it; the app runs its checks on that commit
# (rust-ci.yml's `ref`) and publish-rc.yml then moves rc to it. The calling workflow
# holds a concurrency group, so one candidate is checked at a time. GitHub keeps only
# one run waiting on a group (a third cancels the waiting one), and publish-rc.yml
# refuses a candidate when rc moved under it; requeue-rc.yml re-runs the promotions
# those lose, and runs as a last job here and on a schedule:
#
#   concurrency: {group: promote-rc, cancel-in-progress: false}
#   jobs:
#     candidate:
#       permissions: {contents: write, actions: write, pull-requests: write}
#       uses: onewaytek/owt-stack/.github/workflows/promote-rc.yml@vX.Y.Z
#       with: {source: "${{ inputs.source }}", candidate: true}
#     check:
#       needs: candidate
#       if: needs.candidate.outputs.changed == 'true'
#       uses: onewaytek/owt-stack/.github/workflows/rust-ci.yml@vX.Y.Z
#       with: {ref: "${{ needs.candidate.outputs.sha }}", database: myapp}  # as in the app's CI
#     publish:
#       needs: [candidate, check]
#       permissions: {contents: write, actions: write}
#       uses: onewaytek/owt-stack/.github/workflows/publish-rc.yml@vX.Y.Z
#       with: {sha: "${{ needs.candidate.outputs.sha }}", base: "${{ needs.candidate.outputs.base }}"}
#
# Runs on the arc-openshift-k8s ARC scale set, as rust-ci.yml does (override with the
# RUNS_ON repository or organization variable, a JSON string such as
# '"ubuntu-latest"'); it needs only git and the runner's own Node, which runs the
# github-script steps. Its token can write, so it runs only for the repository's own
# events: a push, a dispatch, a schedule, or a pull request from a branch of the
# repository itself. A fork's pull request, `pull_request_target` and `workflow_run`
# start nothing here, so neither the scale set nor the token is reachable from a fork.

on:
  workflow_call:
    inputs:
      source:
        description: The branch to merge into rc (a PR's head, or main).
        type: string
        required: true
      pr:
        description: The PR's number, for the merge message and the conflict report.
        type: string
        default: ""
      dispatch-release:
        description: >-
          Start the app's release workflow on rc when the merge changed rc's tree (not
          when it only joined histories that already held the same code). Unlike
          publish-rc.yml's input of the name, which dispatches whenever it runs.
        type: boolean
        default: true
      release-workflow:
        description: The app's release workflow file, dispatched on rc.
        type: string
        default: release.yml
      candidate:
        description: >-
          Push the merge to rc-candidate rather than rc, and release nothing:
          publish-rc.yml moves rc to it once the app's checks pass on it.
        type: boolean
        default: false
    outputs:
      changed:
        description: Whether the merge changed rc ("true" or "false").
        value: ${{ jobs.promote.outputs.changed }}
      sha:
        description: The merge commit (with candidate, the commit to check and publish).
        value: ${{ jobs.promote.outputs.sha }}
      base:
        description: The rc commit merged onto; empty when rc did not exist.
        value: ${{ jobs.promote.outputs.base }}

permissions:
  contents: read

jobs:
  promote:
    # A fork's branch can't be fetched from here, and its code is not ours to promote:
    # the merge goes into rc unreviewed.
    if: >-
      ${{ github.repository_owner == 'onewaytek'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    permissions:
      contents: write
      actions: write
      pull-requests: write
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
      base: ${{ steps.merge.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Keep this name: requeue-rc.yml tells a run that set out to promote from one
      # that skipped promotion by whether this step ran.
      - id: merge
        name: Merge into rc
        env:
          SRC: ${{ inputs.source }}
          PR: ${{ inputs.pr }}
          CANDIDATE: ${{ inputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then msg="chore(rc): merge #${PR} (${SRC}) into rc"; else msg="chore(rc): merge ${SRC} into rc"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/${SRC}:refs/remotes/origin/${SRC}"
            git fetch --no-tags origin "+refs/heads/rc:refs/remotes/origin/rc" 2>/dev/null || true
            base=$(git rev-parse -q --verify refs/remotes/origin/rc || true)
            if [ -n "$base" ]; then
              git checkout -q -B rc refs/remotes/origin/rc
            else
              git checkout -q -B rc refs/remotes/origin/main
            fi
            before=$(git rev-parse HEAD)
            # rc stays a superset of main, so prereleases sort above the last release.
            git merge -q --no-ff --no-edit -X theirs refs/remotes/origin/main
            if [ "$SRC" != main ]; then
              git merge -q --no-ff -X theirs -m "$msg" "refs/remotes/origin/${SRC}"
            fi
            if [ "$(git rev-parse HEAD)" = "$before" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "rc already contains ${SRC}"
              exit 0
            fi
            if [ "$CANDIDATE" = true ]; then
              # Overwritten by the next candidate; only publish-rc.yml moves rc.
              git push -f origin HEAD:refs/heads/rc-candidate
              printf 'changed=true\nsha=%s\nbase=%s\n' "$(git rev-parse HEAD)" "$base" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push origin rc; then
              # Whether the merge changed the code and not only the history (see the
              # header); read by "Release rc".
              content=false
              [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "${before}^{tree}")" ] && content=true
              printf 'changed=true\ncontent=%s\nsha=%s\nbase=%s\n' "$content" "$(git rev-parse HEAD)" "$base" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push raced another writer (attempt ${attempt}); retrying"
            sleep $((attempt * 3))
          done
          echo "could not push rc after 5 attempts" >&2
          exit 1
      - name: Release rc
        if: ${{ inputs.dispatch-release && !inputs.candidate && steps.merge.outputs.changed == 'true' && steps.merge.outputs.content == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW: ${{ inputs.release-workflow }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW,
              ref: "rc",
            });
      - name: Report a conflict
        if: ${{ failure() && inputs.pr != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ inputs.pr }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR),
              body: "⚠️ Could not merge this branch into `rc` (likely a conflict with another in-flight feature). Resolve by merging `rc` into this branch or rebasing onto it, then push.",
            });
