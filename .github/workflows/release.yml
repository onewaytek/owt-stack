name: App release (reusable)

# Reusable: cut a release from conventional commits. Called from the app's own
# workflow on a push to main (stable releases) or rc (X.Y.Z-rc.N prereleases):
#
#   jobs:
#     release:
#       needs: ci
#       permissions: {contents: write, issues: write, pull-requests: write}
#       uses: onewaytek/owt-stack/.github/workflows/release.yml@<commit>  # vX.Y.Z, the release the app uses
#     image:
#       needs: release
#       if: needs.release.outputs.version != ''
#       permissions: {contents: read, packages: write}
#       uses: onewaytek/owt-stack/.github/workflows/image.yml@<commit>  # vX.Y.Z, the release the app uses
#       with: {version: "${{ needs.release.outputs.version }}"}
#
# rc carries code no one has reviewed yet (promote-rc merges open pull requests
# into it), and this job holds a token that can push tags. So on rc nothing in the
# checkout configures the release: the repository's own semantic-release
# configuration is removed (a package.json `release` key fails the run), as is any
# committed node_modules a plugin could be loaded from, and the tooling is installed
# away from the checkout's .npmrc. A version from rc must be a prerelease and one
# from main must not, or the run fails before anything downstream builds it.
#
# The bump is semantic-release's reading of the commits since the branch's last
# tag: `feat` is minor, `fix` and `perf` are patch, `!` or a BREAKING CHANGE footer
# is major, and anything else releases nothing. The tag is `vX.Y.Z`, and a GitHub
# release carries the generated notes.
#
# An app whose code reads its own version (to report it to its clients, say) sets
# `version-command` and `version-files`: the command writes the version into those
# files, and they are committed back with the release (`chore(release): vX.Y.Z
# [skip ci]`), so the tag and the files agree.
#
# The tooling is pinned here, not in the app's package.json, so every app releases
# with the same semantic-release and the app needs no Node dependency to do it.
#
# Runs on the arc-openshift-k8s ARC scale set, as rust-ci.yml does (override with the
# RUNS_ON repository or organization variable, a JSON string such as
# '"ubuntu-latest"'). It needs nothing installed there but git: Node comes from
# setup-node and uv from setup-uv. An app's version-command runs there too, so it
# finds no cargo and no gh (see the input). The job holds a token that can push tags, so it
# runs only for the repository's own pushes and dispatches: no pull request, and no
# event a fork can start, reaches it.

on:
  workflow_call:
    inputs:
      version-command:
        description: >-
          Shell run with VERSION set to the new version before the release commit,
          e.g. `uv version "$VERSION" && uv lock`. It runs in bash on main only, with
          GITHUB_TOKEN unset, but as a child of the process holding it, which it
          could read (/proc/$PPID/environ): only code main has reviewed, and
          dependencies the app trusts, belong in it. On the ARC runners it finds git,
          curl, jq, tar, Node and (with `uv`) uv, but no cargo and no gh: an app
          whose command needs more installs it in the command, or runs the release
          GitHub-hosted (RUNS_ON). Empty: the version lives only in the tag.
        type: string
        default: ""
      version-files:
        description: Space-separated files the version command changes, committed back with the release.
        type: string
        default: ""
      changelog:
        description: Maintain CHANGELOG.md (committed back with the release).
        type: boolean
        default: false
      uv:
        description: Install uv for the version command (Python apps).
        type: boolean
        default: false
    outputs:
      version:
        description: The version released, without the v; empty when nothing was.
        value: ${{ jobs.release.outputs.version }}
      channel:
        description: stable (main) or rc (the rc branch's prereleases).
        value: ${{ jobs.release.outputs.channel }}

permissions:
  contents: read

jobs:
  release:
    # One release at a time per branch: two runs computing the next version from the
    # same tags would both cut it. A queued run is replaced by a newer one, which
    # reads every commit since the last tag, so nothing is lost.
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    # A push to a fork's main is not a release of ours, and only a push or a dispatch
    # (both need write access to the repository) releases.
    if: >-
      ${{ github.repository_owner == 'onewaytek'
      && (github.ref_name == 'main' || github.ref_name == 'rc')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
      channel: ${{ steps.semrel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release pushes the tag (and any release commit) with its own
          # token; it should not find another in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Its cache would be keyed by and restored for the checkout's files
          # (packageManager in package.json, the lockfile, .npmrc's cache path), and
          # what an rc job wrote there would be installed below.
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: ${{ inputs.uv }}
      - name: Install semantic-release
        # Outside the checkout, so the app's package.json, lockfile and .npmrc (which
        # could name another registry) are neither consulted nor touched. No lifecycle
        # scripts: the packages below need none, and this job's token can write to the
        # repository.
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p semrel npm-cache
          # A cache of this job's own, empty: nothing another job wrote is installed.
          npm install --prefix "$RUNNER_TEMP/semrel" --registry https://registry.npmjs.org/ \
            --cache "$RUNNER_TEMP/npm-cache" --prefer-online \
            --no-audit --no-fund --no-save --ignore-scripts \
            semantic-release@25.0.9 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@11.0.1 \
            @semantic-release/changelog@7.0.0 \
            conventional-changelog-conventionalcommits@9.3.1
      - name: Configuration
        # An app's own .releaserc wins; otherwise the configuration follows the inputs.
        # An app's own must keep the @semantic-release/exec publishCmd that writes
        # `version` and `channel` to $GITHUB_OUTPUT, or the release's `version` output
        # is empty and no image is ever built.
        env:
          VERSION_COMMAND: ${{ inputs.version-command }}
          VERSION_FILES: ${{ inputs.version-files }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = rc ]; then
            # Unreviewed code: nothing in it may configure or extend the release.
            # semantic-release finds its configuration with cosmiconfig, which first
            # reads a "meta" configuration (package.json, package.yaml,
            # .config/config.*: JavaScript among them, run as it loads) that can add
            # search places of its own; then .releaserc*, .config/releaserc*,
            # release.config.*. All of them go, and node_modules a plugin could load
            # from.
            rm -rf .releaserc* release.config.* .config package.yaml node_modules
            if [ -f package.json ] && node -e 'const p = require("./package.json"); process.exit("release" in p || "cosmiconfig" in p ? 0 : 1)'; then
              echo "package.json configures semantic-release or cosmiconfig; rc releases use the generated configuration only" >&2
              exit 1
            fi
          fi
          if ls .releaserc* release.config.* >/dev/null 2>&1; then
            echo "using the repository's own semantic-release configuration"
            exit 0
          fi
          node - <<'JS' > "$RUNNER_TEMP/releaserc.json"
          // On rc no repository code runs at all: no version command (it would be
          // a child of the process holding the token, which can read its parent's
          // environment), and nothing committed back. A prerelease needs neither.
          const rc = process.env.GITHUB_REF_NAME === "rc";
          const files = rc ? [] : (process.env.VERSION_FILES || "").split(/\s+/).filter(Boolean);
          const changelog = !rc && process.env.CHANGELOG === "true";
          const command = rc ? "" : (process.env.VERSION_COMMAND || "");
          const plugins = [
            ["@semantic-release/commit-analyzer", { preset: "conventionalcommits" }],
            ["@semantic-release/release-notes-generator", { preset: "conventionalcommits" }],
          ];
          if (changelog) plugins.push("@semantic-release/changelog");
          plugins.push(["@semantic-release/exec", {
            // Without this, execa runs the commands with /bin/sh, which is dash on
            // Debian and Ubuntu: no `pipefail`, and the prepare step fails outright.
            shell: "/bin/bash",
            // prepareCmd is a lodash template (${nextRelease.version} is filled in
            // here), so the app's command is not pasted into it: it arrives in
            // VERSION_COMMAND and runs through eval, braces and all. The token that
            // pushes the release is unset first: the command may run code the
            // repository doesn't control (a dependency's build, under `uv lock`).
            prepareCmd: command ? `unset GITHUB_TOKEN GH_TOKEN; set -euo pipefail; export VERSION=\${nextRelease.version}; eval "$VERSION_COMMAND"` : "true",
            // Before anything is tagged: rc makes prereleases and main releases.
            verifyReleaseCmd: `v=\${nextRelease.version}; if [ "$GITHUB_REF_NAME" = rc ]; then [[ $v == *-rc.* ]]; else [[ $v != *-* ]]; fi || { echo "$GITHUB_REF_NAME would release $v" >&2; exit 1; }`,
            publishCmd: "echo \"version=${nextRelease.version}\" >> \"$GITHUB_OUTPUT\" && echo \"channel=${nextRelease.channel || 'stable'}\" >> \"$GITHUB_OUTPUT\"",
          }]);
          const assets = [...files, ...(changelog ? ["CHANGELOG.md"] : [])];
          if (assets.length) plugins.push(["@semantic-release/git", {
            assets,
            message: "chore(release): v${nextRelease.version} [skip ci]\n\n${nextRelease.notes}",
          }]);
          plugins.push("@semantic-release/github");
          // A branch that does not exist (an app without rc) is ignored.
          console.log(JSON.stringify({
            branches: ["main", { name: "rc", prerelease: true }],
            tagFormat: "v${version}",
            plugins,
          }, null, 2));
          JS
          cp "$RUNNER_TEMP/releaserc.json" .releaserc.json
          cat .releaserc.json
      - id: semrel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_COMMAND: ${{ inputs.version-command }}
          NODE_PATH: ${{ runner.temp }}/semrel/node_modules
        run: |
          set -euo pipefail
          # The generated configuration is not the app's file to commit.
          git update-index --assume-unchanged .releaserc.json 2>/dev/null || true
          echo ".releaserc.json" >> .git/info/exclude
          # semantic-release prints commit messages: a line in one shaped like a
          # workflow command (`::set-output …`) must not be obeyed.
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d " \n")"
          echo "::stop-commands::${stop}"
          status=0
          "$RUNNER_TEMP/semrel/node_modules/.bin/semantic-release" || status=$?
          echo "::${stop}::"
          exit "$status"
      - name: The version fits the branch
        # rc makes prereleases and main makes releases, whatever a configuration said.
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || exit 0
          # The tag this run made: on the commit it released (HEAD, or the release
          # commit it added), not an older tag a stray output could name.
          tagged="$(git rev-parse -q --verify --end-of-options "refs/tags/v${VERSION}^{commit}" || true)"
          if [ "$tagged" != "$(git rev-parse --verify HEAD)" ]; then
            echo "v${VERSION} is not the tag this run made" >&2
            exit 1
          fi
          case "$GITHUB_REF_NAME:$VERSION" in
            rc:*-rc.*) ;;
            main:*-*) echo "main released a prerelease version: $VERSION" >&2; exit 1 ;;
            main:*) ;;
            *) echo "$GITHUB_REF_NAME released $VERSION, which is not an rc prerelease" >&2; exit 1 ;;
          esac
