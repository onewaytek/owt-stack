name: Rust CI

# Reusable: the checks every owt-stack app runs, called from the app's own workflow:
#
#   jobs:
#     ci:
#       uses: onewaytek/owt-stack/.github/workflows/rust-ci.yml@vX.Y.Z  # the release the app uses
#       with: {database: myapp, redis: true}
#
# Runs on the arc-openshift-k8s ARC scale set (override with the RUNS_ON
# repository or organization variable, a JSON string such as '"ubuntu-latest"').
# Image builds and releases do not belong here: the ARC runners are rootless with no
# Docker daemon, so they run on GitHub-hosted runners in the app's own workflow.
#
# This repository is public, so any repository may call this workflow; the ARC scale
# set it runs on belongs to the onewaytek organization, so a caller elsewhere sets
# RUNS_ON to runners of its own.
#
# The runners are inside the cluster's network, so a pull request from a fork runs
# nothing here: its code is not ours to run there. Actions are pinned to commits (a
# tag can be moved); the comment beside each names the release.

on:
  workflow_call:
    inputs:
      database:
        description: Postgres database name for the tests; empty for no Postgres.
        type: string
        default: ""
      postgres-major:
        description: >-
          Postgres major version: the one the deployment's CNPG cluster runs. The
          default is for a new app; an app whose cluster runs another passes it.
        type: string
        default: "18"
      redis:
        description: >-
          Start a Redis for the tests (REDIS_URL=redis://127.0.0.1:6379 on ARC,
          redis://redis:6379 elsewhere; extra-env should build on REDIS_URL rather
          than name the host).
        type: boolean
        default: false
      sqlx-check:
        description: >-
          Check that .sqlx/ matches the queries (cargo sqlx prepare --check), after
          applying migrations/; each half is skipped when its directory is absent.
        type: boolean
        default: true
      audit:
        description: Fail on advisories in Cargo.lock (cargo audit).
        type: boolean
        default: true
      css-script:
        description: npm script that builds the stylesheet; empty to skip the job.
        type: string
        default: css:build
      test-args:
        description: Extra arguments for cargo test.
        type: string
        default: ""
      container:
        description: The job container (a Rust toolchain image).
        type: string
        default: mirror.gcr.io/library/rust:1-trixie
      extra-env:
        description: >-
          KEY=VALUE lines added to the environment of every later step: test-only
          values the suite needs (a session secret for test servers, a Redis db).
          Never a real secret; pass those as secrets.
        type: string
        default: ""
      check-command:
        description: >-
          The app's own gate (e.g. `just check`), run instead of the built-in fmt,
          audit, sqlx, clippy and test steps, so CI runs exactly what a developer
          runs. just and cargo-audit are installed for it (sqlx-cli too, for an app
          with a .sqlx/ or migrations/), and the database is migrated first. With it
          set, `audit`, `sqlx-check` and `test-args` are ignored: the app's gate
          decides those.
        type: string
        default: ""
      node-version-file:
        description: File naming the Node version for the stylesheet job; empty for 22.
        type: string
        default: ""
      ref:
        description: >-
          The commit to check; empty for the one that started the workflow. A checked
          promotion passes promote-rc.yml's candidate, so rc moves only to a merge
          that passed.
        type: string
        default: ""
      sccache-redis:
        description: >-
          The Redis that sccache reads and writes compiled objects through
          (SCCACHE_REDIS_ENDPOINT), reachable from the runners; empty for no sccache.
          It is used only when the SCCACHE_REDIS_PASSWORD secret is given too.
        type: string
        default: redis://sccache-redis.sccache.svc:6379
    secrets:
      # Named as the organization secret, because `secrets: inherit` passes a
      # caller's secrets under their own names.
      SCCACHE_REDIS_PASSWORD:
        description: >-
          The password of that Redis. An app passes `secrets: inherit`, so the
          organization secret of this name reaches it; without it the job compiles
          without sccache.
        required: false

# The jobs read the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # sqlx-cli for the gate and the sqlx check (see "Does the app need sqlx-cli").
  SQLX_CLI_VERSION: "0.9.0"

jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    # ARC in Kubernetes container mode needs a job container whenever `services:` is
    # used. Job and service containers share one pod, so services are on localhost,
    # Docker health-check options don't apply, and there are no `ports:` (a hostPort,
    # which every OpenShift SCC rejects).
    #
    # Anywhere else (RUNS_ON naming other runners, e.g. GitHub-hosted for a public
    # repository) the job container and the services are separate containers on one
    # Docker network, so the services are at their names, not localhost. SERVICES_HOST
    # picks between the two; it, DATABASE_URL and REDIS_URL are in every step's
    # environment.
    #
    # Docker Hub's official images, the job container's too, through Google's mirror:
    # the runners share an address, and Docker Hub's anonymous pull limit failed CI at it.
    container: ${{ inputs.container }}
    services:
      postgres:
        image: ${{ inputs.database != '' && format('mirror.gcr.io/library/postgres:{0}-alpine', inputs.postgres-major) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.database }}
      redis:
        image: ${{ inputs.redis && 'mirror.gcr.io/library/redis:8-alpine' || '' }}
    env:
      ON_ARC: ${{ contains(vars.RUNS_ON || 'arc-', 'arc-') }}
      DATABASE_URL: ${{ inputs.database != '' && format('postgres://postgres:postgres@{0}:5432/{1}', contains(vars.RUNS_ON || 'arc-', 'arc-') && '127.0.0.1' || 'postgres', inputs.database) || '' }}
      REDIS_URL: ${{ inputs.redis && format('redis://{0}:6379', contains(vars.RUNS_ON || 'arc-', 'arc-') && '127.0.0.1' || 'redis') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Later steps run the repository's code; leave it no token to find.
          persist-credentials: false
      # Branches built beside each other each take the next free number, and git
      # merges two files with one version without a conflict; sqlx then fails at the
      # second on a fresh database. Up and down halves share a version.
      - name: Migration versions are unique
        shell: bash
        run: |
          [ -d migrations ] || exit 0
          dup=$(ls migrations | sed -E 's/\.(up|down)\.sql$/.sql/' \
            | sed -nE 's/^0*([0-9]+)_(.*)\.sql$/\1 \2/p' \
            | sort -u | awk '{ n[$1]++ } n[$1] == 2 { print $1 }')
          [ -z "$dup" ] && exit 0
          for v in $dup; do
            echo "::error::more than one migration has version $v: $(ls migrations | grep -E "^0*${v}_" | tr '\n' ' ')"
          done
          echo "Renumber the later one after the highest version on the branch it merges into." >&2
          exit 1
      - name: Extra environment
        if: ${{ inputs.extra-env != '' }}
        env:
          EXTRA: ${{ inputs.extra-env }}
        shell: bash
        run: printf '%s\n' "$EXTRA" | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"
      - name: Wait for services
        if: ${{ inputs.database != '' || inputs.redis }}
        env:
          DATABASE: ${{ inputs.database }}
          REDIS: ${{ inputs.redis }}
        shell: bash
        run: |
          local=$([ "$ON_ARC" = "true" ] && echo 1 || echo 0)
          addrs=()
          [ -n "$DATABASE" ] && addrs+=("$([ $local = 1 ] && echo 127.0.0.1 || echo postgres)/5432")
          [ "$REDIS" = "true" ] && addrs+=("$([ $local = 1 ] && echo 127.0.0.1 || echo redis)/6379")
          for _ in $(seq 60); do
            ok=1
            for a in "${addrs[@]}"; do (echo > "/dev/tcp/$a") 2>/dev/null || ok=0; done
            [ $ok = 1 ] && exit 0
            sleep 1
          done
          echo "services ${addrs[*]} did not accept connections within 60s" >&2
          exit 1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The cargo registry and git checkouts come from GitHub's cache, keyed by the
      # lockfile and the toolchain. Nothing of target/ is cached that way: compiled
      # crates come from sccache instead, so a job never inherits another job's build
      # directory (a shared target dir cannot be checked; an sccache entry is keyed by
      # the compiler, its flags and the exact inputs, and a miss costs one compile).
      # The job needs no volume.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
      # sccache, with one Redis shared by every job on the scale set. A Rust entry's key
      # holds absolute paths (the source, CARGO_MANIFEST_DIR, the working directory)
      # and the toolchain's own files, so a hit needs the same crate built at the same
      # paths by the same toolchain: jobs in one image share registry crates, and a
      # repository's own crates with its earlier runs; a developer machine, whose
      # paths differ, keeps entries of its own.
      # Prebuilt and checksummed, as the gate's tools are. Only with the secret: a job
      # without it compiles without sccache. The Redis is bounded (maxmemory, least
      # recently used evicted) and holds only objects whose key names their inputs, so
      # a poisoned entry needs a write to the Redis, which the password guards; every
      # repository on the scale set shares that trust.
      # A step's `if` cannot read secrets, so this step decides for the two after it.
      - name: Is sccache configured
        id: sccache
        env:
          PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
          ENDPOINT: ${{ inputs.sccache-redis }}
        shell: bash
        run: |
          if [ -n "$ENDPOINT" ] && [ -n "$PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sccache-redis endpoint or no SCCACHE_REDIS_PASSWORD secret: compiling without sccache"
          fi
      - name: Install sccache
        if: ${{ steps.sccache.outputs.enabled == 'true' }}
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: sccache@0.18.0
          fallback: none
      # The server checks the Redis as it starts (it reads and writes a check key), so
      # an unreachable Redis or a wrong password stops it here, within about ten
      # seconds; the job then warns and compiles without sccache.
      #
      # The password reaches the server and nothing else: it is in a config file only
      # while the server starts (before any of the app's code has run), and not in the
      # server's environment, nor in any later step's, where the gate, every build
      # script and every test could read it. The server lives for the job
      # (SCCACHE_IDLE_TIMEOUT=0). Should it exit anyway, the next compile starts one
      # without the config, which caches on local disk, and SCCACHE_IGNORE_SERVER_IO_ERROR
      # compiles directly when no server answers: either way the build goes on.
      - name: Start sccache
        if: ${{ steps.sccache.outputs.enabled == 'true' }}
        env:
          PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
          ENDPOINT: ${{ inputs.sccache-redis }}
        shell: bash
        run: |
          conf="$RUNNER_TEMP/sccache.toml"
          # A TOML basic string: backslashes and quotes escaped.
          pw=${PASSWORD//\\/\\\\}
          pw=${pw//\"/\\\"}
          (
            umask 077
            # A month unused and an entry may go; the Redis evicts sooner if full.
            printf '[cache.redis]\nendpoint = "%s"\npassword = "%s"\nexpiration = 2592000\n' \
              "$ENDPOINT" "$pw" > "$conf"
          )
          if env -u PASSWORD SCCACHE_CONF="$conf" SCCACHE_IDLE_TIMEOUT=0 sccache --start-server; then
            rm -f "$conf"
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            } >> "$GITHUB_ENV"
          else
            rm -f "$conf"
            sccache --stop-server > /dev/null 2>&1 || true
            echo "::warning::sccache could not use the Redis at $ENDPOINT (above): compiling without it"
          fi
      # Its own step, so a pin the lockfile can't satisfy fails here by name.
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Install the gate's tools
        if: ${{ inputs.check-command != '' }}
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        # Pinned, so the gate doesn't change under an app between its own commits.
        # Prebuilt and checksummed by the action's manifests; `fallback: none`, so a
        # tool without one fails here instead of being compiled from the shared index.
        with:
          # templates/justfile's `setup` pins the same cargo-audit (and sqlx-cli).
          tool: just@1.58.0,cargo-audit@0.22.2
          fallback: none
      # sqlx publishes no binaries, so sqlx-cli is built: under a cargo home and a
      # target of this job's own, from crates.io afresh, with the checkout's
      # configuration left out, and through sccache when it is on. The binary
      # is kept in the GitHub cache (scoped to the repository and branch, like
      # rust-cache's), keyed by its version and features and by the image it was
      # built in, so it is built once per image rather than every run. It is
      # installed only for an app with a .sqlx/ to check or migrations to apply.
      # Its major must match the apps' sqlx (0.9); move these together, and with
      # templates/justfile's `setup`.
      - name: Does the app need sqlx-cli
        id: sqlx-cli
        if: ${{ inputs.check-command != '' || (inputs.sqlx-check && inputs.database != '') }}
        env:
          DATABASE: ${{ inputs.database }}
          CONTAINER: ${{ inputs.container }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .sqlx ] || { [ -n "$DATABASE" ] && [ -d migrations ]; }; then
            image=$( { echo "$CONTAINER"; cat /etc/os-release 2>/dev/null || true; } | sha256sum | cut -c1-12)
            {
              echo "needed=true"
              echo "dir=$RUNNER_TEMP/sqlx-cli"
              echo "key=sqlx-cli-$SQLX_CLI_VERSION-postgres-rustls-$RUNNER_OS-$RUNNER_ARCH-$image"
            } >> "$GITHUB_OUTPUT"
          else
            echo "no .sqlx/ to check and no migrations/ to apply: sqlx-cli is not installed"
          fi
      - name: Restore sqlx-cli
        id: sqlx-cli-cache
        if: ${{ steps.sqlx-cli.outputs.needed == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sqlx-cli.outputs.dir }}
          key: ${{ steps.sqlx-cli.outputs.key }}
      - name: Build sqlx-cli
        if: ${{ steps.sqlx-cli.outputs.needed == 'true' && steps.sqlx-cli-cache.outputs.cache-hit != 'true' }}
        env:
          DIR: ${{ steps.sqlx-cli.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/cargo-tools"
          # From outside the checkout: its rust-toolchain.toml (an older pin than
          # sqlx-cli needs) and its .cargo/ have no say in the tool's build.
          mkdir -p "$tools" && cd "$tools"
          CARGO_HOME="$tools/home" CARGO_TARGET_DIR="$tools/target" \
            cargo install "sqlx-cli@$SQLX_CLI_VERSION" --locked --no-default-features \
            --features postgres,rustls --root "$DIR"
          cd / && rm -rf "${tools:?}"
      # Saved straight away, so a gate that fails later doesn't throw the build away.
      - name: Save sqlx-cli
        if: ${{ steps.sqlx-cli.outputs.needed == 'true' && steps.sqlx-cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sqlx-cli.outputs.dir }}
          key: ${{ steps.sqlx-cli.outputs.key }}
      - name: Put sqlx-cli on the PATH
        if: ${{ steps.sqlx-cli.outputs.needed == 'true' }}
        env:
          DIR: ${{ steps.sqlx-cli.outputs.dir }}
        shell: bash
        run: |
          "$DIR/bin/sqlx" --version
          echo "$DIR/bin" >> "$GITHUB_PATH"
      - name: Migrate
        if: ${{ inputs.check-command != '' && inputs.database != '' }}
        # A library's tests can want a database without having migrations of their own.
        shell: bash
        run: if [ -d migrations ]; then sqlx migrate run; else echo "no migrations/ to apply"; fi
      - name: The app's gate
        if: ${{ inputs.check-command != '' }}
        env:
          CHECK: ${{ inputs.check-command }}
        shell: bash
        run: eval "$CHECK"
      - run: cargo fmt --check
        if: ${{ inputs.check-command == '' }}
      # Prebuilt and checksummed, as the gate's tools are: `cargo install` would build
      # whatever the shared index says, which any job on the scale set can write.
      - name: Install cargo-audit
        if: ${{ inputs.check-command == '' && inputs.audit }}
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: cargo audit
        if: ${{ inputs.check-command == '' && inputs.audit }}
        run: cargo audit --deny warnings
      - name: sqlx metadata is current
        if: ${{ inputs.check-command == '' && steps.sqlx-cli.outputs.needed == 'true' }}
        shell: bash
        run: |
          if [ -d migrations ]; then cargo sqlx migrate run; fi
          if [ -d .sqlx ]; then SQLX_OFFLINE=false cargo sqlx prepare --check -- --all-targets; fi
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: ${{ inputs.check-command == '' }}
      - name: cargo test
        if: ${{ inputs.check-command == '' }}
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        shell: bash
        # Unquoted on purpose: several arguments.
        run: cargo test --locked $TEST_ARGS
      # Never fails the job. A server that restarted during the job counts only
      # what it served since.
      - name: sccache statistics
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        continue-on-error: true
        shell: bash
        run: |
          stats=$(sccache --show-stats 2>&1) || true
          {
            echo '### sccache'
            echo '```'
            echo "$stats"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$stats" | grep -E 'Cache (hits|misses|errors)|Compile requests executed' || true

  css:
    if: ${{ inputs.css-script != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && '22' || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - name: Build the stylesheet
        env:
          CSS_SCRIPT: ${{ inputs.css-script }}
        run: npm run "$CSS_SCRIPT"
