name: Rust CI

# Reusable: the checks every owt-stack app runs, called from the app's own workflow:
#
#   jobs:
#     ci:
#       uses: onewaytek/owt-stack/.github/workflows/rust-ci.yml@vX.Y.Z  # the release the app uses
#       with: {database: pets, redis: true}
#
# Runs on the arc-openshift-k8s ARC scale set (override with the RUNS_ON
# repository or organization variable, a JSON string such as '"ubuntu-latest"').
# Image builds and releases do not belong here: the ARC runners are rootless with no
# Docker daemon, so they run on GitHub-hosted runners in the app's own workflow.
#
# This repository is public, so any repository may call this workflow; the ARC scale
# set it runs on belongs to the onewaytek organization, so a caller elsewhere sets
# RUNS_ON to runners of its own.
#
# The runners are inside the cluster's network, so a pull request from a fork runs
# nothing here: its code is not ours to run there. Actions are pinned to commits (a
# tag can be moved); the comment beside each names the release.

on:
  workflow_call:
    inputs:
      database:
        description: Postgres database name for the tests; empty for no Postgres.
        type: string
        default: ""
      postgres-major:
        description: Postgres major version; match the deployment's CNPG image.
        type: string
        default: "18"
      redis:
        description: >-
          Start a Redis for the tests (REDIS_URL=redis://127.0.0.1:6379 on ARC,
          redis://redis:6379 elsewhere; extra-env should build on REDIS_URL rather
          than name the host).
        type: boolean
        default: false
      sqlx-check:
        description: Check that .sqlx/ matches the queries (cargo sqlx prepare --check).
        type: boolean
        default: true
      audit:
        description: Fail on advisories in Cargo.lock (cargo audit).
        type: boolean
        default: true
      css-script:
        description: npm script that builds the stylesheet; empty to skip the job.
        type: string
        default: css:build
      test-args:
        description: Extra arguments for cargo test.
        type: string
        default: ""
      container:
        description: The job container (a Rust toolchain image).
        type: string
        default: rust:1-trixie
      extra-env:
        description: >-
          KEY=VALUE lines added to the environment of every later step: test-only
          values the suite needs (a session secret for test servers, a Redis db).
          Never a real secret; pass those as secrets.
        type: string
        default: ""
      check-command:
        description: >-
          The app's own gate (e.g. `just check`), run instead of the built-in fmt,
          audit, sqlx, clippy and test steps, so CI runs exactly what a developer
          runs. just, sqlx-cli and cargo-audit are installed for it, and the database
          is migrated first. With it set, `audit`, `sqlx-check` and `test-args` are
          ignored: the app's gate decides those.
        type: string
        default: ""
      node-version-file:
        description: File naming the Node version for the stylesheet job; empty for 22.
        type: string
        default: ""

# The jobs read the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    # ARC in Kubernetes container mode needs a job container whenever `services:` is
    # used. Job and service containers share one pod, so services are on localhost,
    # Docker health-check options don't apply, and there are no `ports:` (a hostPort,
    # which every OpenShift SCC rejects).
    #
    # Anywhere else (RUNS_ON naming other runners, e.g. GitHub-hosted for a public
    # repository) the job container and the services are separate containers on one
    # Docker network, so the services are at their names, not localhost. SERVICES_HOST
    # picks between the two; it, DATABASE_URL and REDIS_URL are in every step's
    # environment.
    container: ${{ inputs.container }}
    services:
      postgres:
        image: ${{ inputs.database != '' && format('postgres:{0}-alpine', inputs.postgres-major) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.database }}
      redis:
        image: ${{ inputs.redis && 'redis:8-alpine' || '' }}
    env:
      ON_ARC: ${{ contains(vars.RUNS_ON || 'arc-', 'arc-') }}
      DATABASE_URL: ${{ inputs.database != '' && format('postgres://postgres:postgres@{0}:5432/{1}', contains(vars.RUNS_ON || 'arc-', 'arc-') && '127.0.0.1' || 'postgres', inputs.database) || '' }}
      REDIS_URL: ${{ inputs.redis && format('redis://{0}:6379', contains(vars.RUNS_ON || 'arc-', 'arc-') && '127.0.0.1' || 'redis') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run the repository's code; leave it no token to find.
          persist-credentials: false
      - name: Extra environment
        if: ${{ inputs.extra-env != '' }}
        env:
          EXTRA: ${{ inputs.extra-env }}
        shell: bash
        run: printf '%s\n' "$EXTRA" | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"
      - name: Wait for services
        if: ${{ inputs.database != '' || inputs.redis }}
        env:
          DATABASE: ${{ inputs.database }}
          REDIS: ${{ inputs.redis }}
        shell: bash
        run: |
          local=$([ "$ON_ARC" = "true" ] && echo 1 || echo 0)
          addrs=()
          [ -n "$DATABASE" ] && addrs+=("$([ $local = 1 ] && echo 127.0.0.1 || echo postgres)/5432")
          [ "$REDIS" = "true" ] && addrs+=("$([ $local = 1 ] && echo 127.0.0.1 || echo redis)/6379")
          for _ in $(seq 60); do
            ok=1
            for a in "${addrs[@]}"; do (echo > "/dev/tcp/$a") 2>/dev/null || ok=0; done
            [ $ok = 1 ] && exit 0
            sleep 1
          done
          echo "services ${addrs[*]} did not accept connections within 60s" >&2
          exit 1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Its own step, so a pin the lockfile can't satisfy fails here by name.
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Install the gate's tools
        if: ${{ inputs.check-command != '' }}
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        # Pinned, so the gate doesn't change under an app between its own commits.
        # sqlx-cli's major must match the apps' sqlx (0.9); move these together.
        with:
          tool: just@1.58.0,cargo-audit@0.22.2,sqlx-cli@0.9.0
      - name: Migrate
        if: ${{ inputs.check-command != '' && inputs.database != '' }}
        # A library's tests can want a database without having migrations of their own.
        shell: bash
        run: if [ -d migrations ]; then sqlx migrate run; else echo "no migrations/ to apply"; fi
      - name: The app's gate
        if: ${{ inputs.check-command != '' }}
        env:
          CHECK: ${{ inputs.check-command }}
        shell: bash
        run: eval "$CHECK"
      - run: cargo fmt --check
        if: ${{ inputs.check-command == '' }}
      - name: cargo audit
        if: ${{ inputs.check-command == '' && inputs.audit }}
        run: cargo install cargo-audit --locked && cargo audit --deny warnings
      - name: sqlx metadata is current
        if: ${{ inputs.check-command == '' && inputs.sqlx-check && inputs.database != '' }}
        run: |
          cargo install sqlx-cli --locked --no-default-features --features postgres,rustls
          cargo sqlx migrate run
          SQLX_OFFLINE=false cargo sqlx prepare --check -- --all-targets
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: ${{ inputs.check-command == '' }}
      - name: cargo test
        if: ${{ inputs.check-command == '' }}
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        shell: bash
        # Unquoted on purpose: several arguments.
        run: cargo test --locked $TEST_ARGS

  css:
    if: ${{ inputs.css-script != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && '22' || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - name: Build the stylesheet
        env:
          CSS_SCRIPT: ${{ inputs.css-script }}
        run: npm run "$CSS_SCRIPT"
