name: Rust CI

# Reusable: the checks every owt-stack app runs, called from the app's own workflow:
#
#   jobs:
#     ci:
#       uses: onewaytek/owt-stack/.github/workflows/rust-ci.yml@v0.1.0
#       with: {database: pets, redis: true}
#
# Runs on the arc-openshift-k8s ARC scale set (override with the RUNS_ON
# repository or organization variable, a JSON string such as '"ubuntu-latest"').
# Image builds and releases do not belong here: the ARC runners are rootless with no
# Docker daemon, so they run on GitHub-hosted runners in the app's own workflow.
#
# This repository is private, so the calling repository must be in the same
# organization and this repository's Actions settings must allow access from it.
#
# The runners are inside the cluster's network, so a pull request from a fork runs
# nothing here: its code is not ours to run there. Actions are pinned to commits (a
# tag can be moved); the comment beside each names the release.

on:
  workflow_call:
    inputs:
      database:
        description: Postgres database name for the tests; empty for no Postgres.
        type: string
        default: ""
      postgres-major:
        description: Postgres major version; match the deployment's CNPG image.
        type: string
        default: "18"
      redis:
        description: Start a Redis for the tests (REDIS_URL=redis://127.0.0.1:6379).
        type: boolean
        default: false
      sqlx-check:
        description: Check that .sqlx/ matches the queries (cargo sqlx prepare --check).
        type: boolean
        default: true
      audit:
        description: Fail on advisories in Cargo.lock (cargo audit).
        type: boolean
        default: true
      css-script:
        description: npm script that builds the stylesheet; empty to skip the job.
        type: string
        default: css:build
      test-args:
        description: Extra arguments for cargo test.
        type: string
        default: ""
      container:
        description: The job container (a Rust toolchain image).
        type: string
        default: rust:1-trixie
      extra-env:
        description: >-
          KEY=VALUE lines added to the environment of every later step: test-only
          values the suite needs (a session secret for test servers, a Redis db).
          Never a real secret; pass those as secrets.
        type: string
        default: ""
      node-version-file:
        description: File naming the Node version for the stylesheet job; empty for 22.
        type: string
        default: ""
    secrets:
      OWT_STACK_TOKEN:
        description: Read access to onewaytek/owt-stack, to fetch the git dependency.
        required: false

# The jobs read the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Fetch git dependencies with the git CLI, so the insteadOf rewrite below (the
  # token for this private repository) applies.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    # ARC in Kubernetes container mode needs a job container whenever `services:` is
    # used. Job and service containers share one pod, so services are on localhost,
    # Docker health-check options don't apply, and there are no `ports:` (a hostPort,
    # which every OpenShift SCC rejects).
    container: ${{ inputs.container }}
    services:
      postgres:
        image: ${{ inputs.database != '' && format('postgres:{0}-alpine', inputs.postgres-major) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.database }}
      redis:
        image: ${{ inputs.redis && 'redis:8-alpine' || '' }}
    env:
      DATABASE_URL: ${{ inputs.database != '' && format('postgres://postgres:postgres@127.0.0.1:5432/{0}', inputs.database) || '' }}
      REDIS_URL: ${{ inputs.redis && 'redis://127.0.0.1:6379' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run the repository's code; leave it no token to find.
          persist-credentials: false
      - name: Extra environment
        if: ${{ inputs.extra-env != '' }}
        env:
          EXTRA: ${{ inputs.extra-env }}
        shell: bash
        run: printf '%s\n' "$EXTRA" | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"
      - name: Wait for services
        if: ${{ inputs.database != '' || inputs.redis }}
        env:
          DATABASE: ${{ inputs.database }}
          REDIS: ${{ inputs.redis }}
        shell: bash
        run: |
          ports=()
          [ -n "$DATABASE" ] && ports+=(5432)
          [ "$REDIS" = "true" ] && ports+=(6379)
          for _ in $(seq 60); do
            ok=1
            for p in "${ports[@]}"; do (echo > /dev/tcp/127.0.0.1/$p) 2>/dev/null || ok=0; done
            [ $ok = 1 ] && exit 0
            sleep 1
          done
          echo "services on ${ports[*]} did not accept connections within 60s" >&2
          exit 1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The token for this private repository exists in this step's environment and
      # nowhere else: not in a git config file, and not when the tests, build scripts
      # and proc macros below run. They find the checkout in CARGO_HOME and fetch
      # nothing. Secrets can't appear in a step's `if:`, so the test is in the shell.
      - name: Fetch dependencies
        env:
          OWT_STACK_TOKEN: ${{ secrets.OWT_STACK_TOKEN }}
        shell: bash
        run: |
          if [ -n "$OWT_STACK_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="url.https://x-access-token:${OWT_STACK_TOKEN}@github.com/onewaytek/owt-stack.insteadOf" \
              GIT_CONFIG_VALUE_0="https://github.com/onewaytek/owt-stack"
          fi
          cargo fetch --locked
      - run: cargo fmt --check
      - name: cargo audit
        if: ${{ inputs.audit }}
        run: cargo install cargo-audit --locked && cargo audit --deny warnings
      - name: sqlx metadata is current
        if: ${{ inputs.sqlx-check && inputs.database != '' }}
        run: |
          cargo install sqlx-cli --locked --no-default-features --features postgres,rustls
          cargo sqlx migrate run
          SQLX_OFFLINE=false cargo sqlx prepare --check -- --all-targets
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        shell: bash
        # Unquoted on purpose: several arguments.
        run: cargo test --locked $TEST_ARGS

  css:
    if: ${{ inputs.css-script != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && '22' || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - name: Build the stylesheet
        env:
          CSS_SCRIPT: ${{ inputs.css-script }}
        run: npm run "$CSS_SCRIPT"
