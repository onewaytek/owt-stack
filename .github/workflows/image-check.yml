name: Image check

# Reusable: build the image on a pull request and verify it, pushing nothing, so a
# broken Dockerfile or image input fails before a version is tagged rather than
# leaving a release without an image. It is image.yml's build without the release:
#
# - `crane` (the default) runs image.yml's `build` and `verify` jobs on the pull
#   request's merge commit: the compile, the npm assets, the packed layer, and the
#   checks of that layer and the base image (the tools operations rely on, a glibc at
#   least as new as the binary needs). The jobs are image.yml's byte for byte but for
#   the checkout (`just image-check` compares them), so the two cannot drift.
# - `docker` builds the app's Dockerfile with BuildKit on a GitHub-hosted runner,
#   pushing nothing.
#
# Both builders' images are also scanned with grype, failing the run on a vulnerability
# of `vuln-fail-on` severity or worse (critical by default): the crane image as image.yml
# would push it (the base and the layer), the Dockerfile's image once loaded into the
# runner's daemon. Nothing is signed and no SBOM is made here: that needs a pushed image
# and `id-token: write`.
#
# It is a workflow of its own because no job in it can write: a caller's token needs
# only `contents: read`. A reusable workflow whose jobs ask for `packages: write` (as
# image.yml's push does) fails to start for a caller that grants less, even when the
# job is skipped, and a Dependabot pull request's token cannot grant it. Call it from
# a workflow of its own with a `paths:` filter on the image's inputs:
#
#   on:
#     pull_request:
#       paths: [Dockerfile, .dockerignore, Cargo.toml, Cargo.lock, src/**, package.json, ...]
#   permissions: {}
#   jobs:
#     image:
#       if: github.event.pull_request.head.repo.full_name == github.repository
#       permissions: {contents: read}
#       uses: onewaytek/owt-stack/.github/workflows/image-check.yml@<commit>  # vX.Y.Z
#       with: {bin: myapp}   # the inputs of the release's image job that shape the build
#       secrets: {SCCACHE_REDIS_PASSWORD: "${{ secrets.SCCACHE_REDIS_PASSWORD }}"}
#
# Cost: one release build per push to a matching pull request; `cargo-profile` (say
# `dev`, or a profile of the app's own that turns off fat LTO) builds with a lighter
# one instead, and then the check does not prove that the release profile's link
# succeeds. `crane` runs on the arc-openshift-k8s ARC scale set (override with the
# RUNS_ON repository or organization variable, a JSON string such as
# '"ubuntu-latest"'): no GitHub-hosted
# minutes, the cluster's capacity, and through sccache when the app passes the secret
# (a Dependabot pull request has Dependabot's secrets, not Actions', so it compiles
# without). `docker` runs on ubuntu-latest, billed to a private repository, and builds
# cold: a pull request restores the Actions cache only from its own ref, its base
# branch and the default branch, and the release builds write theirs under tag refs, so
# nothing is read.
#
# The jobs run only for the repository's own events: a push, a dispatch, a schedule
# or a pull request from a branch of the repository. A fork's pull request,
# `pull_request_target` and `workflow_run` start nothing here.

on:
  workflow_call:
    inputs:
      builder:
        description: "`crane` (daemonless, on RUNS_ON) or `docker` (the Dockerfile, GitHub-hosted)."
        type: string
        default: crane
      # crane
      bin:
        description: The Cargo binary to build (`cargo build --bin`); installed as /usr/local/bin/server.
        type: string
        default: ""
      bin-links:
        description: Other names in /usr/local/bin for the same binary (symlinks to server), space-separated.
        type: string
        default: ""
      cargo-args:
        description: Extra arguments for `cargo build --locked --bin <bin>` (features, say).
        type: string
        default: ""
      cargo-profile:
        description: >-
          The Cargo profile to build with: `--release` for `release`, else `--profile <name>`
          (`dev` builds into target/debug, any other into target/<name>). Meant for
          image-check.yml, to skip the release profile's link on a pull request; a
          release leaves it at `release`.
        type: string
        default: release
      container:
        description: >-
          The Rust job container. It needs bash, git, curl and tar; the verify job checks
          that the base image's glibc is at least the one the binary links against.
        type: string
        default: mirror.gcr.io/library/rust:1-trixie
      sccache-redis:
        description: As in rust-ci.yml; empty for no sccache.
        type: string
        default: redis://sccache-redis.sccache.svc:6379
      assets-script:
        description: npm script that writes the static assets (after `npm ci`); empty for no npm.
        type: string
        default: css:build
      node-version:
        description: Node for the assets, when node-version-file is empty.
        type: string
        default: "22"
      node-version-file:
        description: File naming the Node version for the assets (.nvmrc, say).
        type: string
        default: ""
      files:
        description: >-
          Paths in the repository, after the assets are built, copied into the work
          directory under the same names (`static` becomes /app/static), space- or
          newline-separated.
        type: string
        default: static
      files-owner:
        description: uid:gid of the copied files.
        type: string
        default: "65532:0"
      base-image:
        description: >-
          The runtime base. A tag is resolved once to its linux/amd64 digest; a digest
          is used as given. Either way the digest is recorded in the
          org.opencontainers.image.base.digest label.
        type: string
        default: registry.access.redhat.com/hi/core-runtime:2
      base-requires:
        description: Paths the base image must have, space-separated (the tools `oc exec` and hooks run).
        type: string
        default: /usr/bin/sh /usr/bin/env /usr/bin/timeout
      workdir:
        description: The work directory (WORKDIR).
        type: string
        default: /app
      workdir-owner:
        description: >-
          uid:gid of the work directory itself. A Dockerfile's WORKDIR makes it as the
          user current at that line, which in the template is core-runtime's 65532.
        type: string
        default: "65532:65532"
      # docker
      context:
        description: The build context (builder docker).
        type: string
        default: .
      dockerfile:
        description: The Dockerfile, relative to the repository root (builder docker).
        type: string
        default: Dockerfile
      # vulnerability scan
      vuln-fail-on:
        description: >-
          Fail on a vulnerability of at least this severity (grype's severity cutoff):
          `negligible`, `low`, `medium`, `high` or `critical`; `none` reports and never
          fails. Applies to the base image and the layer alike.
        type: string
        default: critical
      vuln-ignore-file:
        description: >-
          A grype configuration file in the repository (`.grype.yaml`, say), whose
          `ignore:` rules waive a finding by id, package or fix state; empty for none.
        type: string
        default: ""
    secrets:
      SCCACHE_REDIS_PASSWORD:
        description: "As in rust-ci.yml; passed by name, never with `secrets: inherit`."
        required: false

permissions:
  contents: read

env:
  # go-containerregistry's release archive for linux/amd64, checked against this
  # SHA-256 before crane runs.
  CRANE_VERSION: "0.22.1"
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  build:
    if: >-
      ${{ inputs.builder == 'crane' && github.repository_owner == 'onewaytek'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    container: ${{ inputs.container }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
    steps:
      # The event's own checkout: a pull request's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.assets-script != '' }}
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
      # As the Dockerfile's assets stage: `npm ci`, then the app's script.
      - name: Static assets
        if: ${{ inputs.assets-script != '' }}
        env:
          SCRIPT: ${{ inputs.assets-script }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run "$SCRIPT"
      # The Dockerfile builds in its work directory (/app), and a binary can bake that
      # path in (`env!("CARGO_MANIFEST_DIR")` naming its static files, say). So the
      # build happens there too, from a copy of the checkout with the assets built,
      # and the files are packed from it.
      - name: Build directory
        env:
          WORKDIR: ${{ inputs.workdir }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$WORKDIR" =~ ^(/[A-Za-z0-9._-]+)+$ ]] || [[ "$WORKDIR" =~ (^|/)\.\.?(/|$) ]]; then
            echo "::error::workdir must be an absolute path without . or .. ('$WORKDIR')"; exit 1
          fi
          if [ -e "$WORKDIR" ] && [ -n "$(ls -A "$WORKDIR")" ]; then
            echo "::error::$WORKDIR is not empty in the job container"; exit 1
          fi
          mkdir -p "$WORKDIR" || { echo "::error::the job container's user cannot make $WORKDIR"; exit 1; }
          # The checkout belongs to another uid than the job container's user.
          echo "SOURCE_EPOCH=$(git -c safe.directory="$PWD" log -1 --format=%ct)" >> "$GITHUB_ENV"
          tar --exclude=./.git --exclude=./node_modules -cf - . | tar -C "$WORKDIR" -xf -
      # sccache as in rust-ci.yml (see there for the trust model): the password reaches
      # the sccache server alone, and an unusable Redis means an uncached build.
      - name: Is sccache configured
        id: sccache
        env:
          PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
          ENDPOINT: ${{ inputs.sccache-redis }}
        shell: bash
        run: |
          if [ -n "$ENDPOINT" ] && [ -n "$PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sccache-redis endpoint or no SCCACHE_REDIS_PASSWORD secret: compiling without sccache"
          fi
      - name: Install sccache
        if: ${{ steps.sccache.outputs.enabled == 'true' }}
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: sccache@0.18.0
          fallback: none
      - name: Start sccache
        if: ${{ steps.sccache.outputs.enabled == 'true' }}
        env:
          PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
          ENDPOINT: ${{ inputs.sccache-redis }}
        shell: bash
        run: |
          if [[ "$PASSWORD" == *[[:cntrl:]]* ]]; then
            echo "::warning::SCCACHE_REDIS_PASSWORD holds a control character (a newline, say): compiling without sccache"
            exit 0
          fi
          conf="$RUNNER_TEMP/sccache.toml"
          pw=${PASSWORD//\\/\\\\}
          pw=${pw//\"/\\\"}
          (
            umask 077
            printf '[cache.redis]\nendpoint = "%s"\npassword = "%s"\nexpiration = 2592000\n' \
              "$ENDPOINT" "$pw" > "$conf"
          )
          if env -u PASSWORD SCCACHE_CONF="$conf" SCCACHE_IDLE_TIMEOUT=0 sccache --start-server; then
            rm -f "$conf"
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            } >> "$GITHUB_ENV"
          else
            rm -f "$conf"
            sccache --stop-server > /dev/null 2>&1 || true
            echo "::warning::sccache could not use the Redis at $ENDPOINT (above): compiling without it"
          fi
      - name: Build the binary
        working-directory: ${{ inputs.workdir }}
        env:
          BIN: ${{ inputs.bin }}
          CARGO_ARGS: ${{ inputs.cargo-args }}
          PROFILE: ${{ inputs.cargo-profile }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BIN" ]; then
            echo "::error::the crane builder needs \`bin\`, the Cargo binary to build"
            exit 1
          fi
          if ! [[ "$PROFILE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::cargo-profile is a profile name ('$PROFILE')"
            exit 1
          fi
          if [ "$PROFILE" = release ]; then
            profile=(--release)
          else
            profile=(--profile "$PROFILE")
          fi
          # Unquoted on purpose: several arguments.
          cargo build "${profile[@]}" --locked --bin "$BIN" $CARGO_ARGS
      - name: sccache statistics
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        continue-on-error: true
        shell: bash
        run: |
          stats=$(sccache --show-stats 2>&1) || true
          { echo '### sccache'; echo '```'; echo "$stats"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$stats" | grep -E 'Cache (hits|misses|errors)|Compile requests executed' || true
      # One layer, by name: the binary, its links, the work directory and the listed
      # files, nothing else from the checkout. Credentials-shaped names (the ones
      # templates/dockerignore keeps out of a Docker context) are left out of the files.
      # Times are the commit's and entries sorted, so the same inputs pack the same.
      # No entry keeps group or other write, setuid, setgid or sticky: the runner's
      # work volume makes its directories setgid.
      - name: Pack the layer
        working-directory: ${{ inputs.workdir }}
        env:
          BIN: ${{ inputs.bin }}
          PROFILE: ${{ inputs.cargo-profile }}
          LINKS: ${{ inputs.bin-links }}
          FILES: ${{ inputs.files }}
          OWNER: ${{ inputs.files-owner }}
          WORKDIR: ${{ inputs.workdir }}
          WORKDIR_OWNER: ${{ inputs.workdir-owner }}
        shell: bash
        run: |
          set -euo pipefail
          # The lists are words, never patterns.
          set -f
          for o in "$OWNER" "$WORKDIR_OWNER"; do
            if ! [[ "$o" =~ ^[0-9]+:[0-9]+$ ]]; then
              echo "::error::files-owner and workdir-owner are numeric uid:gid ('$o')"; exit 1
            fi
          done
          wd="${WORKDIR#/}"
          stage="$RUNNER_TEMP/image-root"
          out="$RUNNER_TEMP/image-layer"
          rm -rf "$stage" "$out"
          mkdir -p "$stage/usr/local/bin" "$stage/$wd" "$out"
          # The profile's directory: `dev` builds into debug, the others into their name.
          case "$PROFILE" in dev) dir=debug ;; *) dir="$PROFILE" ;; esac
          install -m 0755 "target/$dir/$BIN" "$stage/usr/local/bin/server"
          links=()
          for l in $LINKS; do
            if ! [[ "$l" =~ ^[A-Za-z0-9._-]+$ ]] || [ "$l" = server ] || [ "$l" = . ] || [ "$l" = .. ]; then
              echo "::error::bin-links: '$l' is not a file name"; exit 1
            fi
            ln -s server "$stage/usr/local/bin/$l"
            links+=("usr/local/bin/$l")
          done
          chmod 0755 "$stage/$wd"
          files=()
          for f in $FILES; do
            f="${f%/}"
            if [ -z "$f" ] || [[ "$f" == /* ]] || [[ "$f" =~ (^|/)\.\.?(/|$) ]]; then
              echo "::error::files: '$f' is not a path inside the repository"; exit 1
            fi
            if [ ! -e "$f" ]; then
              echo "::error::files: '$f' does not exist after the assets are built"; exit 1
            fi
            # A symlink would let one entry write through another; the verify job refuses
            # them, so say which here.
            links_in="$(find "$f" \( -name .git -o -name node_modules -o -name target \) -prune -o -type l -print)"
            if [ -n "$links_in" ]; then
              echo "::error::files: symlinks are not packed (copy the file instead): $links_in"; exit 1
            fi
            files+=("$f")
          done
          epoch="$SOURCE_EPOCH"
          common=(--format=posix --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime
            --sort=name --mtime="@${epoch}" --numeric-owner)
          mode=(--mode=go-w,u-s,g-s,-t)
          # The binary and its links are root's; a symlink keeps its own mode (0777).
          tar -C "$stage" "${common[@]}" "${mode[@]}" --owner=0 --group=0 --no-recursion \
            -cf "$out/layer.tar" usr/local/bin/server
          if [ "${#links[@]}" -gt 0 ]; then
            tar -C "$stage" "${common[@]}" --owner=0 --group=0 --no-recursion \
              -rf "$out/layer.tar" "${links[@]}"
          fi
          # A Dockerfile's WORKDIR is made by the user current at that point: the base's.
          tar -C "$stage" "${common[@]}" "${mode[@]}" --owner="${WORKDIR_OWNER%%:*}" --group="${WORKDIR_OWNER##*:}" \
            --no-recursion -rf "$out/layer.tar" "$wd"
          if [ "${#files[@]}" -gt 0 ]; then
            tar "${common[@]}" "${mode[@]}" --owner="${OWNER%%:*}" --group="${OWNER##*:}" \
              --hard-dereference --exclude-vcs --exclude=node_modules --exclude=target \
              --exclude=.env --exclude='.env.*' --exclude='*.pem' --exclude='*.key' \
              --exclude=.npmrc --exclude=.netrc --exclude=.git-credentials \
              --exclude=.cargo/credentials --exclude=.cargo/credentials.toml \
              --transform="s,^,${wd}/,S" -rf "$out/layer.tar" "${files[@]}"
          fi
          echo "layer: $(stat -c %s "$out/layer.tar") bytes, $(tar -tf "$out/layer.tar" | wc -l) entries"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-layer
          path: ${{ runner.temp }}/image-layer/layer.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # The layer and the base, as image.yml checks them before a push (the same job, and
  # `just image-check` keeps it so).
  verify:
    needs: build
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    permissions:
      contents: read
    outputs:
      layer: ${{ steps.layer.outputs.sha256 }}
      name: ${{ steps.base.outputs.name }}
      digest: ${{ steps.base.outputs.digest }}
      ref: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-layer
          path: ${{ runner.temp }}/image-layer
      - name: Install crane
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/crane"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $dir/crane.tar.gz" | sha256sum -c -
          tar -xzf "$dir/crane.tar.gz" -C "$dir" crane
          rm "$dir/crane.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"
      # The build job ran the app's code; this job trusts its layer only as far as this
      # check: the paths packed, nothing that is not a file, directory or symlink, and
      # no setuid, setgid or sticky bit.
      - name: Check the layer
        id: layer
        env:
          WORKDIR: ${{ inputs.workdir }}
          LINKS: ${{ inputs.bin-links }}
        shell: bash
        run: |
          set -euo pipefail
          set -f
          layer="$RUNNER_TEMP/image-layer/layer.tar"
          wd="${WORKDIR#/}"
          bad=0
          fail() { echo "::error::layer: $*"; bad=1; }
          # One line per entry: type, then the name (GNU tar's escaped form), and for a
          # symlink its target. A name holding " -> " would confuse the split, so names
          # are read again on their own and must match.
          mapfile -t names < <(tar -tf "$layer")
          # With extended attributes and ACLs shown: an entry carrying either (a file
          # capability is a setuid of its own) lists with a `*` or `+` after its mode.
          mapfile -t lines < <(tar --xattrs --xattrs-include='*' --acls --numeric-owner -tvf "$layer")
          [ "${#names[@]}" = "${#lines[@]}" ] || fail "unreadable listing"
          declare -A seen=()
          for i in "${!names[@]}"; do
            name="${names[$i]%/}"
            perms="${lines[$i]%% *}"
            type="${perms:0:1}"
            seen[$name]="$type"
            if [[ "$name" == /* ]] || [[ "$name" =~ (^|/)\.\.?(/|$) ]] || [ -z "$name" ]; then
              fail "'$name' is not a plain relative path"; continue
            fi
            # A symlink's own mode means nothing (it is always 0777).
            if [[ "$perms" == *[*+] ]]; then
              fail "'$name' carries extended attributes or ACLs ($perms)"
            fi
            if [[ "$perms" =~ [sStT] ]] || { [ "$type" != l ] && [[ "${perms:5:1}${perms:8:1}" == *w* ]]; }; then
              fail "'$name' has setuid, setgid, sticky or group/other write ($perms)"
            fi
            case "$name" in
              usr/local/bin/server)
                [ "$type" = - ] || fail "usr/local/bin/server is not a regular file" ;;
              usr/local/bin/*)
                ok=0
                for l in $LINKS; do [ "$name" = "usr/local/bin/$l" ] && ok=1; done
                [ "$ok" = 1 ] || { fail "'$name' is not a declared bin-link"; continue; }
                [ "$type" = l ] && [[ "${lines[$i]}" == *" $name -> server" ]] \
                  || fail "'$name' is not a symlink to server" ;;
              "$wd")
                [ "$type" = d ] || fail "the work directory is not a directory" ;;
              "$wd"/*)
                # Files and directories only: a symlink here could let a later entry
                # write through it, anywhere in the image.
                [ "$type" = - ] || [ "$type" = d ] || fail "'$name' is not a regular file or directory" ;;
              *)
                fail "'$name' is not a path image.yml packs" ;;
            esac
          done
          [ "${seen[usr/local/bin/server]:-}" = - ] || fail "no usr/local/bin/server"
          [ "$bad" = 0 ]
          tar --numeric-owner -tvf "$layer" | head -n 200
          echo "sha256=$(sha256sum "$layer" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check the base image
        id: base
        env:
          BASE: ${{ inputs.base-image }}
          REQUIRES: ${{ inputs.base-requires }}
        shell: bash
        run: |
          set -euo pipefail
          name="${BASE%@*}"
          # A tag after the last slash, if any.
          if [[ "${name##*/}" == *:* ]]; then name="${name%:*}"; fi
          digest="$(crane digest --platform linux/amd64 "$BASE")"
          ref="${name}@${digest}"
          echo "base ${BASE} is ${ref} for linux/amd64"
          fs="$RUNNER_TEMP/base"
          mkdir -p "$fs"
          crane export --platform linux/amd64 "$ref" "$fs/fs.tar"
          tar -tf "$fs/fs.tar" | sed 's,^\./,,' > "$fs/list"
          missing=0
          for p in $REQUIRES; do
            grep -qxF "${p#/}" "$fs/list" || { echo "::error::the base image has no $p"; missing=1; }
          done
          [ "$missing" = 0 ]
          # glibc: the newest symbol version the binary needs against the newest the
          # base's libc defines. A static binary needs none.
          need="$(tar -xOf "$RUNNER_TEMP/image-layer/layer.tar" usr/local/bin/server | { grep -ao 'GLIBC_2\.[0-9]*' || true; } | sort -uV | tail -n1)"
          if [ -n "$need" ]; then
            libc="$(grep -E '(^|/)libc\.so\.6$' "$fs/list" | head -n1 || true)"
            [ -n "$libc" ] || { echo "::error::the binary links glibc ($need) and the base image has no libc.so.6"; exit 1; }
            have="$(tar -xOf "$fs/fs.tar" "$libc" | { grep -ao 'GLIBC_2\.[0-9]*' || true; } | sort -uV | tail -n1)"
            if [ -z "$have" ] || [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | tail -n1)" != "$have" ]; then
              echo "::error::the binary needs $need and the base image's glibc is ${have:-unknown}"
              exit 1
            fi
            echo "glibc: the binary needs $need, the base has $have"
          fi
          rm -rf "$fs"
          {
            echo "name=${name}"
            echo "digest=${digest}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

  # The image as it would be pushed (the base and the layer), scanned for vulnerabilities
  # before anything is pushed. Holds no write permission and runs none of the app's code.
  scan:
    needs: [build, verify]
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"arc-openshift-k8s"') }}
    permissions:
      contents: read
    env:
      BASE_REF: ${{ needs.verify.outputs.ref }}
      IGNORE_FILE: ${{ inputs.vuln-ignore-file }}
    steps:
      # Only for the ignore file; the pull request's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.vuln-ignore-file != '' }}
        with:
          persist-credentials: false
      - name: The ignore file is in the checkout
        if: ${{ inputs.vuln-ignore-file != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IGNORE_FILE" == /* ]] || [[ "$IGNORE_FILE" =~ (^|/)\.\.(/|$) ]] || [ ! -f "$IGNORE_FILE" ]; then
            echo "::error::vuln-ignore-file must be a file in the repository ('$IGNORE_FILE')"; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-layer
          path: ${{ runner.temp }}/image-layer
      - name: Install crane
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/crane"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $dir/crane.tar.gz" | sha256sum -c -
          tar -xzf "$dir/crane.tar.gz" -C "$dir" crane
          rm "$dir/crane.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"
      # What push makes, less its configuration: the base pinned by digest and the layer
      # on top, written to a tarball instead of a registry.
      - name: Assemble the image
        shell: bash
        run: |
          set -euo pipefail
          crane append --base "$BASE_REF" --new_layer "$RUNNER_TEMP/image-layer/layer.tar" \
            --new_tag scan.invalid/image:scan --output "$RUNNER_TEMP/image.tar"
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker-archive:${{ runner.temp }}/image.tar
          severity-cutoff: ${{ inputs.vuln-fail-on == 'none' && 'critical' || inputs.vuln-fail-on }}
          fail-build: ${{ inputs.vuln-fail-on != 'none' }}
          output-format: table
          config: ${{ inputs.vuln-ignore-file }}

  docker:
    if: >-
      ${{ inputs.builder == 'docker' && github.repository_owner == 'onewaytek'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    # BuildKit needs a Docker daemon, which the ARC runners do not have.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          # Loaded into the runner's Docker daemon, to be scanned.
          load: true
          tags: image-check:scan
          platforms: linux/amd64
          build-args: VERSION=check
      - name: The ignore file is in the checkout
        if: ${{ inputs.vuln-ignore-file != '' }}
        env:
          IGNORE_FILE: ${{ inputs.vuln-ignore-file }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IGNORE_FILE" == /* ]] || [[ "$IGNORE_FILE" =~ (^|/)\.\.(/|$) ]] || [ ! -f "$IGNORE_FILE" ]; then
            echo "::error::vuln-ignore-file must be a file in the repository ('$IGNORE_FILE')"; exit 1
          fi
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: image-check:scan
          severity-cutoff: ${{ inputs.vuln-fail-on == 'none' && 'critical' || inputs.vuln-fail-on }}
          fail-build: ${{ inputs.vuln-fail-on != 'none' }}
          output-format: table
          config: ${{ inputs.vuln-ignore-file }}

  # Says why when nothing would run, rather than succeed with no check.
  refused:
    if: >-
      ${{ !((inputs.builder == 'crane' || inputs.builder == 'docker') && github.repository_owner == 'onewaytek'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
    # Never the scale set: this may be a fork's event.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Nothing is built
        env:
          BUILDER: ${{ inputs.builder }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::no check: builder is '${BUILDER}' (crane or docker), and the jobs run only for this organization's own push, workflow_dispatch, schedule or same-repository pull_request (this is ${EVENT})"
          exit 1
