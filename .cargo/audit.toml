# `cargo audit` (run in CI). Each ignored advisory says why it doesn't apply.

[advisories]
ignore = [
    # rsa: Marvin, a timing side channel on private-key operations (decryption,
    # signing). The advisory names >=0.10.0, but the pre-release in use
    # (0.10.0-rc.19) predates it. It arrives two ways. Through jsonwebtoken's
    # rust_crypto backend, behind owt-auth's `jwt` feature (owt-accounts builds
    # without it), and through owt-accounts' passkeys: webauthn-rs -> webauthn-rs-core
    # and webauthn-attestation-ca -> crypto-glue 0.2.2 -> rsa 0.10.0-rc.19. Both
    # paths only verify signatures, a public-key operation. (The test suite signs
    # with a throwaway key.) Lifts when jsonwebtoken and webauthn-rs move to rsa
    # >=0.10.0.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5: secret-dependent branches in arithmetic meant to be
    # constant-time; fixed only in 0.7.6. It arrives the same way, through
    # jsonwebtoken's rust_crypto backend (p256/p384 -> elliptic-curve 0.13), and
    # ES256/ES384 verification computes on public values only: the signature, the
    # key and the message. Lifts when a jsonwebtoken release moves to
    # elliptic-curve 0.14.
    "RUSTSEC-2026-0387",

    # basic-toml: unmaintained. It arrives through askama_derive, a proc-macro that
    # reads the crate's own askama.toml at compile time; nothing links it into a
    # built artifact and it never sees runtime or untrusted input. Lifts when an
    # askama release drops the dependency.
    "RUSTSEC-2026-0374",

    # libsqlite3-sys 0.37: the bundled C SQLite carries CVE-2026-119375; fixed in
    # 0.39. Cargo resolves the lockfile with every optional dependency of the graph,
    # so sqlx's and sqlx-macros-core's optional `sqlx-sqlite` (and its
    # libsqlite3-sys) sit in Cargo.lock although no crate here turns on a SQLite
    # feature: `cargo tree -i libsqlite3-sys --target all` prints nothing, and
    # nothing compiles or links it. sqlx-sqlite 0.9.0 caps it at <0.38, so no
    # lockfile update can move it. Lifts when an sqlx release accepts 0.39.
    "RUSTSEC-2026-0459",
]
