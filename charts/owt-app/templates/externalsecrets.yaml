{{- /*
One ExternalSecret per Secret of the app, each read whole from <path>/<key> in
OpenBao. With adopt, ESO merges into the Secret that already exists and leaves it
when the ExternalSecret goes; without, it owns the Secret it creates. Neither the
ExternalSecrets nor their Secrets are ever pruned or deleted by Argo, and the
runtime role's Secret keeps cnpg.io/reload, so CNPG picks up a new password.
*/ -}}
{{- $e := .Values.externalSecrets -}}
{{- if $e.enabled }}
{{- $name := include "owt.name" . -}}
{{- $path := required "externalSecrets.path is required (apps/<app>/<env>)" $e.path -}}
{{- $items := list -}}
{{- if $e.env }}
{{- $items = append $items (dict "secret" (printf "%s-env" $name) "key" "env") -}}
{{- end }}
{{- if $e.dbRuntime }}
{{- $items = append $items (dict "secret" (printf "%s-runtime" (include "owt.db" .)) "key" "db-runtime" "type" "kubernetes.io/basic-auth" "labels" (dict "cnpg.io/reload" "true")) -}}
{{- end }}
{{- if .Values.redis.enabled }}
{{- $items = append $items (dict "secret" (printf "%s-redis" $name) "key" "redis") -}}
{{- end }}
{{- if include "owt.tunnel" . }}
{{- $items = append $items (dict "secret" (include "owt.tunnelSecret" .) "key" "tunnel") -}}
{{- end }}
{{- range $e.extra }}
{{- $items = append $items . -}}
{{- end }}
{{- range $items }}
---
apiVersion: {{ $e.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ required "each externalSecrets.extra entry needs a secret" .secret }}
  namespace: {{ include "owt.namespace" $ }}
  labels: {app: "{{ $name }}"}
  annotations:
    {{- include "owt.keep" $ | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef: {name: openbao, kind: SecretStore}
  target:
    name: {{ .secret }}
    {{- if $e.adopt }}
    creationPolicy: Merge
    deletionPolicy: Retain
    {{- else }}
    creationPolicy: Owner
    {{- end }}
    template:
      {{- with .type }}
      type: {{ . }}
      {{- end }}
      metadata:
        {{- with .labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        annotations:
          {{- include "owt.keep" $ | nindent 10 }}
  dataFrom:
    - extract: {key: "{{ $path }}/{{ required "each externalSecrets.extra entry needs a key" .key }}"}
{{- end }}
{{- end }}
