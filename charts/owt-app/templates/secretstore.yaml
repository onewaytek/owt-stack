{{- /*
The namespace's SecretStore: OpenBao through External Secrets' vault provider, as
the ServiceAccount eso-openbao by Kubernetes auth, trusting OpenBao's serving
certificate through the OpenShift service CA. Namespaced, so no other namespace's
ExternalSecret can use it.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $s := .Values.externalSecrets.store -}}
{{- $ns := include "owt.namespace" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.serviceAccount }}
  namespace: {{ $ns }}
  labels: {app: "{{ include "owt.name" . }}"}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: SecretStore
metadata:
  name: openbao
  namespace: {{ $ns }}
  labels: {app: "{{ include "owt.name" . }}"}
spec:
  provider:
    vault:
      server: {{ $s.server }}
      path: {{ $s.mount }}
      version: v2
      caProvider:
        type: ConfigMap
        name: {{ $s.caConfigMap }}
        key: {{ $s.caKey }}
      auth:
        kubernetes:
          mountPath: {{ $s.authMount }}
          role: {{ $s.role | default $ns }}
          serviceAccountRef: {name: {{ $s.serviceAccount }}}
{{- end }}
