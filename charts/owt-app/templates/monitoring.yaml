{{- /*
monitoring.yaml's scraping through user-workload monitoring: the app's /metrics and
the CloudNativePG exporter. Needs monitoring-edit.
*/ -}}
{{- if .Values.monitoring.enabled }}
{{- $name := include "owt.name" . -}}
{{- $ns := include "owt.namespace" . -}}
{{- $db := include "owt.db" . -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {app: "{{ $name }}"}
spec:
  selector:
    matchLabels: {app: "{{ $name }}"}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $db }}
  namespace: {{ $ns }}
  labels: {app: "{{ $name }}"}
spec:
  selector:
    matchLabels: {cnpg.io/cluster: "{{ $db }}"}
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.monitoring.interval }}
---
# The exporter's port, for Prometheus alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $db }}-metrics
  namespace: {{ $ns }}
  labels: {app: "{{ $name }}"}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: "{{ $db }}"}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: "{{ .Values.metricsNamespace }}"}
      ports: [{port: 9187}]
{{- end }}
