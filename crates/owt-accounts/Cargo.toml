[package]
name = "owt-accounts"
description = "Accounts and sign-in flows the onewaytek apps share: the accounts table and its migration, credentials with a decoy check and rehash, sessions revoked by epoch, the signed-in extractors, linked provider identities, one-time sign-in links, roles, the staff accounts admin, sign-in with a provider, and which version of each site policy an account accepted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `example` on the view models of `admin::Views` and `policies::Views`: filled-in view
# models for an app's unit tests of its own templates, and
# `policies::agree_to_current` for fixtures (`owt-test` enables it).
test-util = []
# `cli::AccountCommand`, the operator commands as a clap `Subcommand`: an app nests it
# in its own `Cli`. Without it clap is not built.
cli = ["dep:clap"]

[dependencies]
anyhow.workspace = true
askama.workspace = true
axum = { workspace = true, features = ["tokio", "http1", "form", "query", "original-uri"] }
base64.workspace = true
clap = { workspace = true, optional = true }
owt-auth.workspace = true
owt-web.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["derive", "macros", "json"] }
thiserror.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
unicode-security.workspace = true
url.workspace = true

[dev-dependencies]
owt-runtime.workspace = true
# owt-test depends on this crate, so a unit test under `src/` that used it would link
# two copies of owt-accounts whose types do not unify: tests that use it live in `tests/`.
owt-test.workspace = true
tokio.workspace = true
tower.workspace = true

[lints]
workspace = true
