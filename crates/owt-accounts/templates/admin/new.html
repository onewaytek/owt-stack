<section class="owt-admin">
<header class="owt-admin-head">
<h1>{{ v.words.new_account }}</h1>
<a href="{{ v.list }}">{{ v.words.all_accounts }}</a>
</header>
{% if let Some(e) = v.error %}<div class="owt-alert owt-alert-error" role="alert">{{ e }}</div>
{% endif %}<form class="owt-form" method="post" action="{{ v.action }}">
{{ username }}
{{ email }}
<fieldset class="owt-fieldset">
<legend class="owt-label">{{ v.words.access }}</legend>
<p class="owt-hint">{{ v.words.every_account_is_a_user }}</p>
<label class="owt-check"><input type="checkbox" name="staff"{% if v.staff %} checked{% endif %}><span><strong>{{ v.words.staff }}</strong><span class="owt-hint owt-block">{{ v.words.staff_hint_new }}</span></span></label>
{% for r in v.roles %}<label class="owt-check"><input type="checkbox" name="role" value="{{ r.name }}"{% if r.checked %} checked{% endif %}><span><strong>{{ r.label }}</strong><span class="owt-hint owt-block">{{ r.description }}{% if r.staff %} {{ v.words.staff_hold_it_anyway }}{% endif %}</span></span></label>
{% endfor %}</fieldset>
<p class="owt-hint">{{ v.words.no_password_yet }}</p>
<div class="owt-actions"><button class="owt-button" type="submit">{{ v.words.create_account }}</button></div>
</form>
</section>
