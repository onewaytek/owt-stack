[package]
name = "owt-auth"
description = "Authentication the onewaytek apps share: Argon2id password hashing, sign-in throttling, a bot guard for anonymous forms, OAuth 2 sign-in with PKCE, and JWT bearer verification against a JWKS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["jwt"]
# `jwt`: bearer-token verification against a JWKS. It brings jsonwebtoken and, through
# its rust_crypto backend, `rsa` (RUSTSEC-2023-0071, see .cargo/audit.toml); the rest
# of the crate (oauth's ID-token checks included) needs neither.
jwt = ["dep:jsonwebtoken"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
governor.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"], optional = true }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
axum = { workspace = true, features = ["tokio", "http1", "json"] }
rsa.workspace = true

[lints]
workspace = true
