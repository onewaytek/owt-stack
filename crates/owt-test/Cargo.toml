[package]
name = "owt-test"
description = "Test harness for apps on owt-stack: an in-process client with a cookie jar, the real router on an ephemeral port, and account fixtures with a client signed in without Argon2. Dev-dependency only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
base64.workspace = true
cookie.workspace = true
getrandom.workspace = true
html-escape.workspace = true
http-body-util.workspace = true
owt-accounts = { workspace = true, features = ["test-util"] }
owt-web.workspace = true
regex.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
url.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["tokio", "http1", "form"] }

[lints]
workspace = true
