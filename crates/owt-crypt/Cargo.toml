[package]
name = "owt-crypt"
description = "Envelope field encryption for apps on owt-stack: XChaCha20-Poly1305 field seals under data keys per tenant wrapped by a KEK, ciphertexts bound to their table, column and row, key versions with rotation, re-encryption and rewrap jobs, HMAC blind indexes, zeroized keys; a local KEK for development and a YubiHSM 2 KEK for production."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `yubihsm::YubiHsmKek`: a wrap key in a YubiHSM 2, over yubihsm-connector (HTTP) or USB.
yubihsm = ["dep:yubihsm"]

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
getrandom = "0.3"
hmac = "0.13"
owt-runtime = { workspace = true, default-features = false }
rand.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
yubihsm = { version = "0.42", default-features = false, features = ["http", "usb", "passwords"], optional = true }
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
tokio.workspace = true
yubihsm = { version = "0.42", default-features = false, features = ["http", "usb", "passwords", "mockhsm"] }

[lints]
workspace = true
