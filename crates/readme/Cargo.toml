[package]
name = "readme"
description = "Compiles the README's Rust examples as doctests, so the usage instructions can't go stale."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
askama.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["tokio", "http1"] }
cookie.workspace = true
owt-accounts = { workspace = true, features = ["test-util", "cli", "redis", "passkeys"] }
owt-auth = { workspace = true, features = ["jwt", "redis"] }
owt-crypt = { workspace = true, features = ["yubihsm"] }
owt-runtime = { workspace = true, features = ["redis"] }
owt-web.workspace = true
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true

# Only the README's examples use these, and doctests see dev-dependencies: as normal
# dependencies, nothing the library itself compiles uses them, and cargo warns.
[dev-dependencies]
owt-audit = { workspace = true, features = ["cli", "s3"] }
owt-bus.workspace = true
owt-change.workspace = true
owt-storage.workspace = true
owt-mail.workspace = true
owt-test.workspace = true

[lints]
workspace = true
