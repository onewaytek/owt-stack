[package]
name = "readme"
description = "Compiles the README's Rust examples as doctests, so the usage instructions can't go stale."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
askama.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["tokio", "http1"] }
cookie.workspace = true
owt-accounts = { workspace = true, features = ["test-util", "cli"] }
owt-audit = { workspace = true, features = ["cli"] }
owt-auth = { workspace = true, features = ["jwt"] }
owt-bus.workspace = true
owt-change.workspace = true
owt-crypt = { workspace = true, features = ["yubihsm"] }
owt-runtime = { workspace = true, features = ["redis"] }
owt-test.workspace = true
owt-web.workspace = true
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["fs"] }

[lints]
workspace = true
