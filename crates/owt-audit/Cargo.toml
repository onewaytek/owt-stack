[package]
name = "owt-audit"
description = "Append-only, hash-chained audit events for apps on owt-stack: one chain per tenant, SHA-256 over a canonical encoding, Postgres triggers that refuse changes, a verifier, and anchoring of the chain heads to external write-once storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `cli::AuditCommand`, the verifier as a clap `Subcommand` an app nests in its own CLI.
cli = ["dep:clap"]
# `anchor::S3ObjectLock`, an anchor in an S3 bucket under an Object Lock retention.
s3 = ["dep:reqwest", "dep:hmac", "dep:md-5", "dep:base64", "dep:tokio", "dep:zeroize"]

[dependencies]
anyhow.workspace = true
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
futures.workspace = true
hmac = { version = "0.13", optional = true }
md-5 = { version = "0.11", optional = true }
reqwest = { workspace = true, optional = true }
owt-runtime = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true
tokio.workspace = true

[lints]
workspace = true
